<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#17352f;font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}h1{font-size:32px;line-height:1.2;margin:8px 0 18px}p{max-width:76ch}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:8px 14px;border:1px solid #829890;background:white;border-radius:5px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#17352f;color:white}button:focus-visible{outline:3px solid #d48824;outline-offset:3px}.chart-wrap{overflow:auto;background:white;border:1px solid #d9e2dc;border-radius:8px;padding:12px}svg{width:100%;display:block;min-width:500px;height:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:left;border-bottom:1px solid #cfd9d2;padding:10px 12px}.status{min-height:24px;font-size:14px;color:#58716a}.source{font-size:13px;color:#58716a}#description{margin-bottom:8px}@media print{main{padding:0}.controls{display:none}.chart-wrap{overflow:visible}svg{min-width:0}details{display:block}}</style><main><p class="source" id="source"></p><h1 id="title"></h1><p id="description"></p><div class="controls" id="controls" aria-label="观察状态"></div><p id="state-description"></p><p id="status" class="status" aria-live="polite"></p><div class="chart-wrap"><svg id="chart" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title"></title><desc id="svg-desc"></desc><g id="guides"></g><g id="marks"></g></svg></div><h2>当前状态原值</h2><table><thead><tr><th>对象</th><th>值</th><th>单位</th><th>数据状态</th></tr></thead><tbody id="data-table"></tbody></table><p class="source">过渡期间文字明确显示目标值；数值几何仅在同一坐标语义下连续变化。新增或缺失对象不从零生长。原始输入内嵌，几何映射仍须由制作者核验。</p></main><script>@@RUNTIME@@</script><script>
'use strict';const spec=JSON.parse(@@SPEC@@),NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id),registry=new Map(spec.marks.map(m=>[m.id,m])),nodes=new Map();let target=spec.states[0],space=target.semanticSpace;
document.title=spec.title;$('title').textContent=spec.title;$('description').textContent=spec.description;$('source').textContent=spec.source;$('svg-title').textContent=spec.title;$('chart').setAttribute('viewBox',`0 0 ${spec.width} ${spec.height}`);
function elt(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));parent.append(e);return e}
function values(st){return new Map(st.values.map(v=>[v.id,v]))}
function geometry(st){return new Map(st.values.filter(v=>v.value!==null).map(v=>[v.id,v.geometry]))}
function metadata(st){$('state-description').textContent=st.description;$('svg-desc').textContent=st.description;const gg=$('guides');gg.replaceChildren();for(const g of st.guides){elt('line',{x1:g.x1,y1:g.y1,x2:g.x2,y2:g.y2,stroke:'#d3ddd6','stroke-width':1},gg);if(g.text){const t=elt('text',{x:g.x1,y:g.y1-8,fill:'#58716a','font-size':13},gg);t.textContent=g.text}}const vv=values(st);$('data-table').replaceChildren();for(const m of spec.marks){const v=vv.get(m.id),tr=document.createElement('tr');for(const text of [m.label,v&&v.value!==null?String(v.value):'—',v?.unit||m.unit,!v?'不在范围':v.value===null?'未报':'已提供']){const td=document.createElement('td');td.textContent=text;tr.append(td)}$('data-table').append(tr)}for(const b of $('controls').children)b.setAttribute('aria-pressed',String(b.dataset.state===st.id))}
function paint(scene,info){const vv=values(target);for(const[id,n]of nodes){if(!scene.has(id)){n.group.remove();nodes.delete(id)}}for(const[id,g]of scene){const m=registry.get(id);let n=nodes.get(id);if(!n){const group=elt('g',{'data-id':id},$('marks'));const mark=elt(m.kind,{'data-mark':id,fill:m.kind==='line'?'none':m.color,stroke:m.color,'stroke-width':m.kind==='line'?3:0},group),label=elt('text',{'data-label':id,fill:'#17352f','font-size':14},group);n={group,mark,label};nodes.set(id,n)}for(const[k,x]of Object.entries(g))if(k!=='lx'&&k!=='ly')n.mark.setAttribute(k,String(x));n.label.setAttribute('x',g.lx);n.label.setAttribute('y',g.ly);const v=vv.get(id);n.label.textContent=`${m.label} · ${info.phase==='transition'?'目标 ':''}${String(v.value)} ${v.unit||m.unit}`}
$('chart').dataset.phase=info.phase;$('chart').dataset.progress=String(info.progress);$('status').textContent=info.phase==='transition'?'几何正在变化；标签与下表为目标值。':'过渡已结束；显示当前状态。'}
metadata(target);const motion=ChartMotion.create({scene:geometry(target),duration:440,ease:t=>1-(1-t)**3,paint});
function select(id){const next=spec.states.find(s=>s.id===id);if(!next)throw Error('Unknown state');if(next===target)return;const comparable=next.semanticSpace===space;target=next;space=next.semanticSpace;metadata(next);motion.to(geometry(next),{duration:comparable?440:0});}
for(const st of spec.states){const b=document.createElement('button');b.type='button';b.textContent=st.label;b.dataset.state=st.id;b.setAttribute('aria-pressed',String(st===target));b.addEventListener('click',()=>select(st.id));$('controls').append(b)}
// Testable public handle exposes only explicit actions and runtime snapshots, never fabricated data.
window.SceneChart={select,snapshot:()=>Object.fromEntries(motion.snapshot()),isRunning:()=>motion.isRunning(),finish:()=>motion.finish(),target:()=>target.id};
</script></html>
