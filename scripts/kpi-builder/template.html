</style><main><div class="eyebrow">METRIC BRIEF</div><h1 id="title"></h1><div class="scope" id="scope"></div><div class="controls"><label>查看期间<select id="period" aria-label="查看期间"></select></label><button id="export">导出当前数据</button></div><div id="status" role="status" aria-live="polite"></div><section id="cards" aria-label="指标摘要"></section><div id="source" class="source"></div></main><dialog id="dialog"><h2 id="detail-title"></h2><div id="detail"></div><button id="close">关闭详情</button></dialog>
<script id="data" type="application/json">__DATA__</script><script>
'use strict';

function route(m){return Object.hasOwn(m,'target')?'target':m.trend?.length?'trend':'value'}

function spark(m,card){let wrap=card.querySelector('.figure'),pts=m.trend,valid=pts.filter(p=>p.value!==null);wrap.append(el('div','figure-label',m.trendLabel));if(!valid.length){wrap.append(el('p','neutral','此期间无有效趋势观测'));return}let lo=Math.min(...valid.map(p=>p.value)),hi=Math.max(...valid.map(p=>p.value));if(lo===hi){let pad=Math.max(1,Math.abs(lo)*.05);lo-=pad;hi+=pad}let x=i=>12+i*276/Math.max(1,pts.length-1),y=v=>74-(v-lo)/(hi-lo)*60;let svg=svgEl('svg',{viewBox:'0 0 300 90',role:'img','aria-label':`${m.trendLabel}；${valid.length}个有效观测；缺测断开；局部纵轴`});let d='',open=false;pts.forEach((p,i)=>{if(p.value===null){open=false;return}d+=`${open?'L':'M'}${x(i)},${y(p.value)} `;open=true});svg.append(svgEl('path',{d,fill:'none',stroke:'#8b2840','stroke-width':2,'stroke-linejoin':'round'}));pts.forEach((p,i)=>{if(p.value===null)return;let dot=svgEl('circle',{cx:x(i),cy:y(p.value),r:i===pts.length-1?3.5:2,fill:'#8b2840'}),title=svgEl('title',{});title.textContent=`${p.date}：${fmt(p.value,m)} ${m.unit}`;dot.append(title);svg.append(dot)});wrap.append(svg);let labels=el('div','axis-labels');labels.append(el('span','',pts[0].date),el('span','',pts.at(-1).date));wrap.append(labels,el('div','figure-label',`局部纵轴 ${fmt(lo,m)}—${fmt(hi,m)} ${m.unit} · 缺测断开`));}
function stableData(){return {title:data.title,scope:data.scope,source:data.source,state:structuredClone(data.states[stateIndex])}}
function updateDetails(){if(activeDetail===null)return;let m=data.states[stateIndex].metrics[activeDetail];$('detail-title').textContent=m.label+' · '+m.period;let box=$('detail');box.replaceChildren(el('p','',m.definition),el('p','',`当前值：${raw(m.value)} ${m.unit}`),el('p','',comparison(m).text));if(m.comparison)box.append(el('p','',`比较基期原值：${raw(m.comparison.value)} ${m.unit}`));if(Object.hasOwn(m,'target'))box.append(el('p','',`目标：${raw(m.target)} ${m.unit}`));if(m.trend?.length){let table=el('table'),head=el('tr');head.append(el('th','','期间'),el('th','',m.unit));table.append(head);for(let p of m.trend){let row=el('tr');row.append(el('td','',p.date),el('td','',raw(p.value)));table.append(row)}box.append(table)}box.append(el('p','source','来源：'+data.source));}
function render(animate=true){cancelAnimationFrame(raf);let gen=++generation,s=data.states[stateIndex],focused=document.activeElement?.id;let prior=new Map(displayed);$('cards').replaceChildren();$('period').value=String(stateIndex);let animations=[];
s.metrics.forEach((m,i)=>{let card=el('article','card');card.dataset.id=m.id;card.dataset.route=route(m);let reading=el('div','reading'),value=el('span','value',fmt(m.value,m)),unit=el('span','unit',m.unit);reading.append(value,unit);let c=comparison(m);card.append(el('h2','',m.label),el('div','period',m.period+' · 本期值'),reading,el('div','compare '+c.tone,c.text),el('div','transition',''),el('div','figure',''));let foot=el('div','foot'),button=el('button','details','数据详情');button.id='detail-'+i;button.onclick=()=>{activeDetail=i;returnFocus=button.id;updateDetails();$('dialog').showModal();$('close').focus()};foot.append(el('div','definition',m.definition),button);card.append(foot);$('cards').append(card);let geometry=route(m)==='target'?bullet(m,card):null;if(route(m)==='trend')spark(m,card);
let from=prior.get(m.id),to=m.value;let can=animate&&!reduced.matches&&typeof from==='number'&&typeof to==='number'&&from!==to;
// A target scale changes between periods. Rebuild it to the final-state scale;

if(geometry&&(from<geometry.domain[0]||from>geometry.domain[1]))can=false;
const draw=v=>{displayed.set(m.id,v);value.textContent=headline(v,m);value.title=raw(m.value)+' '+m.unit;card.dataset.displayed=v===null?'missing':String(v);if(geometry){let a=geometry.x(0),b=geometry.x(v??0);geometry.bar.setAttribute('x',Math.min(a,b));geometry.bar.setAttribute('width',Math.abs(a-b));geometry.bar.style.visibility=v===null?'hidden':'visible'}};

if(focused&&$(focused))$(focused).focus({preventScroll:true});updateDetails();$('status').textContent=s.label;

}
$('title').textContent=data.title;document.title=data.title;$('scope').textContent=data.scope;$('source').textContent='来源：'+data.source;data.states.forEach((s,i)=>{let o=el('option','',s.label);o.value=String(i);$('period').append(o)});$('period').onchange=e=>{stateIndex=Number(e.target.value);render()};$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('close',()=>{activeDetail=null;if(returnFocus)$(returnFocus)?.focus()});reduced.addEventListener('change',()=>render(false));addEventListener('beforeprint',()=>render(false));$('export').onclick=()=>{render(false);let blob=new Blob([JSON.stringify(stableData(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='kpi-current.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};window.kpiApp={setState:i=>{if(!Number.isInteger(i)||i<0||i>=data.states.length)throw Error('invalid state');stateIndex=i;render()},snapshot:stableData,finish:()=>render(false)};render(false);
</script></html>
