<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-marimekko desc-marimekko"><title id="title-marimekko">渠道大小与产品结构，一起保留</title><desc id="desc-marimekko">不同规模渠道的产品组合怎样分配？ 列宽表示渠道总量占比，列内高度表示产品份额，面积对应总体份额。 同时解码宽和高；小块精确值见直接标签，不把等高当等规模。门店=现场下单；自提=线上预订到店取货；外送不含自提。 三互斥渠道、三互斥产品，总额400万元；门店=现场下单；自提=线上单到店取；外送不含自提</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 47     构成 · Marimekko结构图</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">渠道大小与产品结构，一起保留</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="217.5" y="185" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">门店 · 100</text><g data-key="0" opacity="1"><rect x="90" y="220" width="255" height="160" fill="#A51D36" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="217.5" y="307" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品A 50 · 50%</text></g><g data-key="0" opacity="1"><rect x="90" y="380" width="255" height="96" fill="#287C82" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="217.5" y="435" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品B 30 · 30%</text></g><g data-key="0" opacity="1"><rect x="90" y="476" width="255" height="64" fill="#A77B27" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="217.5" y="515" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">产品C 20 · 20%</text></g><text x="217.5" y="580" font-size="19" fill="#6E6067" text-anchor="middle" font-weight="400">宽度 25%</text><text x="600" y="185" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">外送 · 200</text><g data-key="1" opacity="1"><rect x="345" y="220" width="510" height="128" fill="#A51D36" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="600" y="291" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品A 80 · 40%</text></g><g data-key="1" opacity="1"><rect x="345" y="348" width="510" height="96" fill="#287C82" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="600" y="403" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品B 60 · 30%</text></g><g data-key="1" opacity="1"><rect x="345" y="444" width="510" height="96" fill="#A77B27" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="600" y="499" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">产品C 60 · 30%</text></g><text x="600" y="580" font-size="19" fill="#6E6067" text-anchor="middle" font-weight="400">宽度 50%</text><text x="982.5" y="185" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">自提 · 100</text><g data-key="2" opacity="1"><rect x="855" y="220" width="255" height="64" fill="#A51D36" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="982.5" y="259" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品A 20 · 20%</text></g><g data-key="2" opacity="1"><rect x="855" y="284" width="255" height="160" fill="#287C82" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="982.5" y="371" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">产品B 50 · 50%</text></g><g data-key="2" opacity="1"><rect x="855" y="444" width="255" height="96" fill="#A77B27" stroke="#FBF8F5" stroke-width="3" rx="0"/><text x="982.5" y="499" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">产品C 30 · 30%</text></g><text x="982.5" y="580" font-size="19" fill="#6E6067" text-anchor="middle" font-weight="400">宽度 25%</text><text x="80" y="625" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">宽度=渠道总体份额；高度=列内产品份额；矩形面积=产品金额÷400。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="663" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一模拟统计窗，未指定日期</text><text x="60" y="679" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">范围：三互斥渠道、三互斥产品，总额400万元；门店=现场下单；自提=线上单到店取；外送不含自提</text><text x="60" y="695" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>