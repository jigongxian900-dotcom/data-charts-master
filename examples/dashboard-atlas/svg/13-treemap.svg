<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-treemap desc-treemap"><title id="title-treemap">面积给结构，文字给精确值</title><desc id="desc-treemap">预算在两条业务线中如何分配？ 嵌套矩形保留父子层级，面积对应金额。 适合看结构，不适合比较非常接近的金额。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 13     构成 · 矩形树图</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">面积给结构，文字给精确值</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="92" y="178" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">增长 · 500</text><g data-key="0" opacity="1"><rect x="80" y="198" width="520" height="177.6" fill="#A51D36" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="104" y="281.8" font-size="25" fill="#FBF8F5" text-anchor="start" font-weight="600">投放</text><text x="104" y="314.8" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="400">240 万元 · 24%</text></g><g data-key="1" opacity="1"><rect x="80" y="375.6" width="520" height="118.4" fill="#287C82" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="104" y="429.8" font-size="25" fill="#FBF8F5" text-anchor="start" font-weight="600">渠道</text><text x="104" y="462.8" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="400">160 万元 · 16%</text></g><g data-key="2" opacity="1"><rect x="80" y="494" width="520" height="74" fill="#A77B27" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="104" y="526" font-size="25" fill="#30262D" text-anchor="start" font-weight="600">研究</text><text x="104" y="559" font-size="20" fill="#30262D" text-anchor="start" font-weight="400">100 万元 · 10%</text></g><text x="612" y="178" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">运营 · 500</text><g data-key="3" opacity="1"><rect x="600" y="198" width="520" height="185" fill="#79618F" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="624" y="285.5" font-size="25" fill="#FBF8F5" text-anchor="start" font-weight="600">履约</text><text x="624" y="318.5" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="400">250 万元 · 25%</text></g><g data-key="4" opacity="1"><rect x="600" y="383" width="520" height="111" fill="#42759A" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="624" y="433.5" font-size="25" fill="#FBF8F5" text-anchor="start" font-weight="600">系统</text><text x="624" y="466.5" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="400">150 万元 · 15%</text></g><g data-key="5" opacity="1"><rect x="600" y="494" width="520" height="74" fill="#B45D71" stroke="#FBF8F5" stroke-width="4" rx="0"/><text x="624" y="526" font-size="25" fill="#FBF8F5" text-anchor="start" font-weight="600">培训</text><text x="624" y="559" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="400">100 万元 · 10%</text></g><line x1="80" y1="615" x2="104" y2="615" stroke="#A51D36" stroke-width="3" /><text x="114" y="620" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">每个矩形面积与预算金额成正比</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="670" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一预算周期，未指定日期  |  范围：两条业务线，六个项目，共1000万元</text><text x="60" y="691" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>