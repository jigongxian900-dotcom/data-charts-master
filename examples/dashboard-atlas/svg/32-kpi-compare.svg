<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-kpi-compare desc-kpi-compare"><title id="title-kpi-compare">涨跌不是好坏，先看指标定义</title><desc id="desc-kpi-compare">规模、利润率与单位成本怎样变化？ 每项指标邻近显示两个明确基期；率差用百分点，低为优指标保留有利方向。 利润率变化用pp，不写成相同数值的%；单位成本降低为有利。不同单位不共轴。 四个独立指标，同一模拟范围；成本指标下降有利</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 32     指标 · KPI同环比对照</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">分指标单位</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">涨跌不是好坏，先看指标定义</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><g data-key="0" opacity="1"><rect x="70" y="160" width="520" height="200" fill="#FFFFFF" stroke="none" stroke-width="1" rx="0"/><text x="90" y="192" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">营业额</text><text x="90" y="253" font-size="52" fill="#A51D36" text-anchor="start" font-weight="700">142</text><text x="90" y="284" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">万元</text><path d="M90,312.7511737089202 L106.81818181818181,311.81220657277 L123.63636363636363,310.8732394366197 L140.45454545454544,309.69953051643193 L157.27272727272725,308.76056338028167 L174.0909090909091,307.3521126760563 L190.9090909090909,305.7089201877934 L207.72727272727275,304.30046948356807 L224.54545454545453,303.5962441314554 L241.36363636363637,301.9530516431925 L258.1818181818182,300.3098591549296 L275,298.6666666666667" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="353" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">1—12月 · ↑ 高为优</text><text x="325" y="206" font-size="24" fill="#167763" text-anchor="start" font-weight="600">同比 +22.41%</text><text x="325" y="237" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">去年12月 116 万元</text><text x="325" y="288" font-size="24" fill="#167763" text-anchor="start" font-weight="600">环比 +5.19%</text><text x="325" y="319" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">本年11月 135 万元</text></g><g data-key="1" opacity="1"><rect x="640" y="160" width="520" height="200" fill="#FFFFFF" stroke="none" stroke-width="1" rx="0"/><text x="660" y="192" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">订单数</text><text x="660" y="253" font-size="52" fill="#A51D36" text-anchor="start" font-weight="700">7.1</text><text x="660" y="284" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">万单</text><path d="M660,311.34272300469485 L676.8181818181819,310.4037558685446 L693.6363636363636,309.46478873239437 L710.4545454545455,308.52582159624416 L727.2727272727273,307.5868544600939 L744.0909090909091,306.17840375586854 L760.9090909090909,304.7699530516432 L777.7272727272727,303.830985915493 L794.5454545454545,302.8920187793427 L811.3636363636364,301.4835680751174 L828.1818181818182,299.6056338028169 L845,298.6666666666667" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="660" y="353" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">1—12月 · ↑ 高为优</text><text x="895" y="206" font-size="24" fill="#167763" text-anchor="start" font-weight="600">同比 +18.33%</text><text x="895" y="237" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">去年12月 6 万单</text><text x="895" y="288" font-size="24" fill="#167763" text-anchor="start" font-weight="600">环比 +2.9%</text><text x="895" y="319" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">本年11月 6.9 万单</text></g><g data-key="2" opacity="1"><rect x="70" y="380" width="520" height="200" fill="#FFFFFF" stroke="none" stroke-width="1" rx="0"/><text x="90" y="412" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">利润率</text><text x="90" y="473" font-size="52" fill="#A51D36" text-anchor="start" font-weight="700">20</text><text x="90" y="504" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">%</text><path d="M90,527 L106.81818181818181,526.6666666666666 L123.63636363636363,526 L140.45454545454544,525.1666666666666 L157.27272727272725,524 L174.0909090909091,523.5 L190.9090909090909,523.3333333333334 L207.72727272727275,522.8333333333334 L224.54545454545453,522 L241.36363636363637,521.6666666666666 L258.1818181818182,522 L275,518.6666666666666" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="573" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">1—12月 · ↑ 高为优</text><text x="325" y="426" font-size="24" fill="#167763" text-anchor="start" font-weight="600">同比 +3 pp</text><text x="325" y="457" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">去年12月 17 %</text><text x="325" y="508" font-size="24" fill="#167763" text-anchor="start" font-weight="600">环比 +2 pp</text><text x="325" y="539" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">本年11月 18 %</text></g><g data-key="3" opacity="1"><rect x="640" y="380" width="520" height="200" fill="#FFFFFF" stroke="none" stroke-width="1" rx="0"/><text x="660" y="412" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">每单履约成本</text><text x="660" y="473" font-size="52" fill="#A51D36" text-anchor="start" font-weight="700">4.8</text><text x="660" y="504" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">元/单</text><path d="M660,518.6666666666666 L676.8181818181819,519.2619047619048 L693.6363636363636,519.8571428571429 L710.4545454545455,519.2619047619048 L727.2727272727273,519.8571428571429 L744.0909090909091,520.452380952381 L760.9090909090909,521.047619047619 L777.7272727272727,521.6428571428571 L794.5454545454545,521.047619047619 L811.3636363636364,520.452380952381 L828.1818181818182,521.047619047619 L845,523.4285714285714" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="660" y="573" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">1—12月 · ↓ 低为优</text><text x="895" y="426" font-size="24" fill="#167763" text-anchor="start" font-weight="600">同比 -4%</text><text x="895" y="457" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">去年12月 5 元/单</text><text x="895" y="508" font-size="24" fill="#167763" text-anchor="start" font-weight="600">环比 -7.69%</text><text x="895" y="539" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">本年11月 5.2 元/单</text></g><text x="80" y="625" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">利润率的差写百分点（pp）；金额与订单的变化写百分比（%）。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：本期2026年12月；环比11月；同比2025年12月</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：四个独立指标，同一模拟范围；成本指标下降有利</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>