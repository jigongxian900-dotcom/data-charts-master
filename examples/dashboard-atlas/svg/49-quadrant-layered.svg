<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-quadrant-layered desc-quadrant-layered"><title id="title-quadrant-layered">增长、利润率、目标，不能只看一项</title><desc id="desc-quadrant-layered">哪些区域增长慢、利润率低，且没有完成目标？ 坐标表达增长与利润率，面积表示规模，外圈线型表示是否达标。 零增长与20%利润率为预设切分线；不是自动投资优先级。 六区域；规模非负，目标为预设值</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 49     关系 · 四象限与规模达成</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">% / 万元</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">增长、利润率、目标，不能只看一项</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="140" y1="550" x2="940" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="125" y="556" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">10</text><line x1="140" y1="470" x2="940" y2="470" stroke="#E4D9DC" stroke-width="1" /><text x="125" y="476" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">15</text><line x1="140" y1="390" x2="940" y2="390" stroke="#E4D9DC" stroke-width="1" /><text x="125" y="396" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">20</text><line x1="140" y1="310" x2="940" y2="310" stroke="#E4D9DC" stroke-width="1" /><text x="125" y="316" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">25</text><line x1="140" y1="230" x2="940" y2="230" stroke="#E4D9DC" stroke-width="1" /><text x="125" y="236" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">30</text><text x="140" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">-20%</text><text x="300" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">-10%</text><text x="460" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">0%</text><text x="620" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">10%</text><text x="780" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">20%</text><text x="940" y="582" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">30%</text><line x1="460" y1="230" x2="460" y2="550" stroke="#30262D" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="140" y1="390" x2="940" y2="390" stroke="#30262D" stroke-width="1.5" stroke-dasharray="5 5"/><g data-key="0" opacity="1"><circle cx="700" cy="326" r="27.885480092693403" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="700" cy="326" r="32.8854800926934" fill="none" stroke="#30262D" stroke-width="2" /><text x="700" y="283.1145199073066" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">北区</text></g><g data-key="1" opacity="1"><circle cx="588" cy="422" r="24.14953415699773" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="588" cy="422" r="29.14953415699773" fill="none" stroke="#6E6067" stroke-width="2" stroke-dasharray="4 3"/><text x="588" y="382.85046584300227" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">东区</text></g><g data-key="2" opacity="1"><circle cx="364" cy="358" r="19.71801207018598" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="364" cy="358" r="24.71801207018598" fill="none" stroke="#6E6067" stroke-width="2" stroke-dasharray="4 3"/><text x="364" y="323.281987929814" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">南区</text></g><g data-key="3" opacity="1"><circle cx="268" cy="486" r="16.09968943799849" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="268" cy="486" r="21.09968943799849" fill="none" stroke="#6E6067" stroke-width="2" stroke-dasharray="4 3"/><text x="268" y="454.9003105620015" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">西区</text></g><g data-key="4" opacity="1"><circle cx="508" cy="262" r="21.297887219158618" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="508" cy="262" r="26.297887219158618" fill="none" stroke="#30262D" stroke-width="2" /><text x="508" y="225.7021127808414" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">中区</text></g><g data-key="5" opacity="1"><circle cx="828" cy="518" r="13.942740046346701" fill="#A51D36" stroke="#FBF8F5" stroke-width="2"/><circle cx="828" cy="518" r="18.9427400463467" fill="none" stroke="#6E6067" stroke-width="2" stroke-dasharray="4 3"/><text x="828" y="489.0572599536533" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">新城</text></g><text x="80" y="184" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">纵轴：利润率（%）</text><text x="1030" y="246" font-size="18" fill="#30262D" text-anchor="start" font-weight="400">实圈：达标</text><text x="1030" y="282" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">虚圈：未达</text><text x="1030" y="348" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">面积：规模</text><text x="80" y="625" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">横轴：同比增长率；零增长、20%利润率是本例预设阈值。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="663" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一模拟月度窗，对比去年同月；无实际日期</text><text x="60" y="679" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">范围：六区域；规模非负，目标为预设值</text><text x="60" y="695" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>