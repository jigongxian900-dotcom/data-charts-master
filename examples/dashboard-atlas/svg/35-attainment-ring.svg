<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-attainment-ring desc-attainment-ring"><title id="title-attainment-ring">达成与超额，先核对有效目标</title><desc id="desc-attainment-ring">实际相对目标达到多少，超额有多少？ 有效正目标才计算实际÷目标；满环表示100%门槛，超额另列。 可切未达、超额、目标未知、目标为零。未知或零目标不计算百分比，不能伪造0%。 四种互斥演示情景；默认超额完成，切换不合并</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 35     指标 · 单项达成圆环</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">达成与超额，先核对有效目标</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><circle cx="360" cy="365" r="150" fill="none" stroke="#E4D9DC" stroke-width="25"/><circle cx="360" cy="365" r="150" fill="none" stroke="#A51D36" stroke-width="25" stroke-dasharray="942.4777960769379 942.4777960769379" transform="rotate(-90 360 365)"/><text x="360" y="365" font-size="57" fill="#A51D36" text-anchor="middle" font-weight="700">112%</text><text x="360" y="405" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">168 / 150 万元</text><text x="650" y="220" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">高于目标</text><text x="650" y="284" font-size="53" fill="#A51D36" text-anchor="start" font-weight="700">18</text><text x="650" y="315" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">万元</text><text x="650" y="352" font-size="18" fill="#30262D" text-anchor="start" font-weight="400">超额 12%</text><text x="650" y="440" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">满环 = 达到 100% 门槛</text><text x="650" y="483" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">完整比率单列，不以多圈编码。</text><text x="80" y="610" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">当前情景：超额完成；其余情景可在页面切换，互不合并。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：独立模拟月度情景，未指定日历月</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：四种互斥演示情景；默认超额完成，切换不合并</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>