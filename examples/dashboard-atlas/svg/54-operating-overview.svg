<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-operating-overview desc-operating-overview"><title id="title-operating-overview">规模、目标与结构，用同一范围阅读</title><desc id="desc-operating-overview">本月是否增长、是否达标，订单结构怎样？ 当前规模、同环比、六期实际/目标与渠道组成共享区域筛选。 合成演示，不是接入真实数据的生产系统；渠道结构不能解释增长因果。到店=现场下单；自提=线上预订到店取货；外送不含自提。 北/东/南三区可筛选；到店=现场下单；自提=线上单到店取；外送不含自提</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 54     综合 · 一页经营综合</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元 / 单 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">规模、目标与结构，用同一范围阅读</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="80" y="175" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">12月营业额</text><text x="80" y="225" font-size="44" fill="#A51D36" text-anchor="start" font-weight="700">160</text><text x="80" y="256" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">万元</text><text x="450" y="175" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">同比 / 环比</text><text x="450" y="225" font-size="31" fill="#A51D36" text-anchor="start" font-weight="700">+16.8% / +8.1%</text><text x="450" y="256" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">去年同月 / 本年11月</text><text x="820" y="175" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">目标完成率</text><text x="820" y="225" font-size="44" fill="#A51D36" text-anchor="start" font-weight="700">97%</text><text x="820" y="256" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">目标 165 万元</text><line x1="80" y1="281" x2="1120" y2="281" stroke="#E4D9DC" stroke-width="1" /><text x="80" y="314" font-size="20" fill="#30262D" text-anchor="start" font-weight="600">实际与当月目标</text><line x1="125" y1="550" x2="725" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="110" y="556" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">0</text><line x1="125" y1="497.5" x2="725" y2="497.5" stroke="#E4D9DC" stroke-width="1" /><text x="110" y="503.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">45</text><line x1="125" y1="445" x2="725" y2="445" stroke="#E4D9DC" stroke-width="1" /><text x="110" y="451" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">90</text><line x1="125" y1="392.5" x2="725" y2="392.5" stroke="#E4D9DC" stroke-width="1" /><text x="110" y="398.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">135</text><line x1="125" y1="340" x2="725" y2="340" stroke="#E4D9DC" stroke-width="1" /><text x="110" y="346" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">180</text><path d="M125,410 L245,403 L365,392.5 L485,382 L605,370.33333333333337 L725,357.5" fill="none" stroke="#6E6067" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M125,417 L245,407.66666666666663 L365,398.33333333333337 L485,386.66666666666663 L605,377.33333333333337 L725,363.33333333333337" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="125" cy="417" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><text x="143" y="405" font-size="18" fill="#30262D" text-anchor="start" font-weight="600">114</text><text x="125" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">7月</text><circle cx="245" cy="407.66666666666663" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><text x="245" y="395.66666666666663" font-size="18" fill="#30262D" text-anchor="middle" font-weight="600">122</text><text x="245" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">8月