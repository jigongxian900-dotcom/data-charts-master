th="13" height="13" fill="#287C82" stroke="none" stroke-width="1" rx="0"/><text x="846" y="498" font-size="19" fill="#30262D" text-anchor="start" font-weight="400">外送</text><text x="1110" y="498" font-size="18" fill="#30262D" text-anchor="end" font-weight="400">30% · 24000 单</text><rect x="820" y="532" width="13" height="13" fill="#A77B27" stroke="none" stroke-width="1" rx="0"/><text x="846" y="546" font-size="19" fill="#30262D" text-anchor="start" font-weight="400">自提</text><text x="1110" y="546" font-size="18" fill="#30262D" text-anchor="end" font-weight="400">20% · 16000 单</text><line x1="200" y1="619" x2="232" y2="619" stroke="#A51D36" stroke-width="3" /><text x="242" y="625" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">实际</text><line x1="450" y1="619" x2="482" y2="619" stroke="#6E6067" stroke-width="3" stroke-dasharray="5 5"/><text x="492" y="625" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">当月目标</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：2026年7—12月；同比2025年同月</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：北/东/南三区可筛选；到店=现场下单；自提=线上单到店取；外送不含自提</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>