5.89799565091977,328.96706606614293 A182,182 0 0 1 389.99999999999994,200 L390,256 A126,126 0 0 0 269.46784314294445,345.2848918919451 Z" fill="#A77B27" stroke="#FBF8F5" stroke-width="4"/></g><rect x="690" y="465" width="16" height="16" fill="#A77B27" stroke="none" stroke-width="1" rx="0"/><text x="726" y="484" font-size="24" fill="#30262D" text-anchor="start" font-weight="400">自提</text><text x="726" y="520" font-size="24" fill="#A77B27" text-anchor="start" font-weight="600">69 万单   20.3%</text><text x="390" y="378" font-size="57" fill="#30262D" text-anchor="middle" font-weight="700">340</text><text x="390" y="415" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">万单 · 全渠道</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一统计窗，未指定日期</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：三类互斥订单渠道，共340万单</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>