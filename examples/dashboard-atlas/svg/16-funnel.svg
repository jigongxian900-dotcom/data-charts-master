<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-funnel desc-funnel"><title id="title-funnel">每个阶段的损耗都可追溯</title><desc id="desc-funnel">同一批报名对象在哪个阶段流失？ 按顺序保留阶段人数与上一步转化率，等高条长度编码数量。 同批、去重、同观察窗；阶段存量不能直接替代此转化链。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 16     流程 · 同批阶段条</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">每个阶段的损耗都可追溯</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">人</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="250" y="212" font-size="21" fill="#30262D" text-anchor="end" font-weight="400">报名</text><g data-key="0" opacity="1"><rect x="280" y="184" width="650" height="43" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="948" y="213" font-size="24" fill="#30262D" text-anchor="start" font-weight="600">1200</text></g><text x="250" y="292" font-size="21" fill="#30262D" text-anchor="end" font-weight="400">资格通过</text><g data-key="1" opacity="1"><rect x="280" y="264" width="520" height="43" fill="#287C82" stroke="none" stroke-width="1" rx="0"/><text x="818" y="293" font-size="24" fill="#30262D" text-anchor="start" font-weight="600">960</text></g><text x="1080" y="291" font-size="22" fill="#A51D36" text-anchor="end" font-weight="600">80%</text><text x="250" y="372" font-size="21" fill="#30262D" text-anchor="end" font-weight="400">完成面谈</text><g data-key="2" opacity="1"><rect x="280" y="344" width="390" height="43" fill="#A77B27" stroke="none" stroke-width="1" rx="0"/><text x="688" y="373" font-size="24" fill="#30262D" text-anchor="start" font-weight="600">720</text></g><text x="1080" y="371" font-size="22" fill="#A51D36" text-anchor="end" font-weight="600">75%</text><text x="250" y="452" font-size="21" fill="#30262D" text-anchor="end" font-weight="400">签署意向</text><g data-key="3" opacity="1"><rect x="280" y="424" width="273" height="43" fill="#79618F" stroke="none" stroke-width="1" rx="0"/><text x="571" y="453" font-size="24" fill="#30262D" text-anchor="start" font-weight="600">504</text></g><text x="1080" y="451" font-size="22" fill="#A51D36" text-anchor="end" font-weight="600">70%</text><text x="250" y="532" font-size="21" fill="#30262D" text-anchor="end" font-weight="400">正式入组</text><g data-key="4" opacity="1"><rect x="280" y="504" width="204.75" height="43" fill="#42759A" stroke="none" stroke-width="1" rx="0"/><text x="502.75" y="533" font-size="24" fill="#30262D" text-anchor="start" font-weight="600">378</text></g><text x="1080" y="531" font-size="22" fill="#A51D36" text-anchor="end" font-weight="600">75%</text><text x="1080" y="160" font-size="17" fill="#6E6067" text-anchor="end" font-weight="400">上一步转化</text><line x1="280" y1="620" x2="304" y2="620" stroke="#A51D36" stroke-width="3" /><text x="314" y="625" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">累计转化率 31.5% = 378 ÷ 1,200</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="670" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">期间：同批同观察窗，未指定日期  |  范围：1200人起始批次，逐阶段去重计数</text><text x="60" y="691" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>