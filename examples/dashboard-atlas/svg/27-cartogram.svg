<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-cartogram desc-cartogram"><title id="title-cartogram">保留方位，取消面积误导</title><desc id="desc-cartogram">服务站在各区域的密度如何？ 等面积格子保留粗略方位，不让大地理面积主导视觉。 原创虚构九宫区域，非真实行政地图，不支持距离测量。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 27     空间 · 区域方格示意</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">保留方位，取消面积误导</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">站点 / 万人</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><g data-key="0" opacity="1"><rect x="190" y="184" width="127" height="127" fill="#F3CDD4" stroke="none" stroke-width="1" rx="0"/><text x="253" y="233" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">西北</text><text x="253" y="274" font-size="34" fill="#30262D" text-anchor="middle" font-weight="700">8</text></g><g data-key="1" opacity="1"><rect x="324" y="184" width="127" height="127" fill="#D57286" stroke="none" stroke-width="1" rx="0"/><text x="387" y="233" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">北部</text><text x="387" y="274" font-size="34" fill="#30262D" text-anchor="middle" font-weight="700">13</text></g><g data-key="2" opacity="1"><rect x="458" y="184" width="127" height="127" fill="#D57286" stroke="none" stroke-width="1" rx="0"/><text x="521" y="233" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">东北</text><text x="521" y="274" font-size="34" fill="#30262D" text-anchor="middle" font-weight="700">16</text></g><g data-key="3" opacity="1"><rect x="190" y="318" width="127" height="127" fill="#F3CDD4" stroke="none" stroke-width="1" rx="0"/><text x="253" y="367" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">西部</text><text x="253" y="408" font-size="34" fill="#30262D" text-anchor="middle" font-weight="700">7</text></g><g data-key="4" opacity="1"><rect x="324" y="318" width="127" height="127" fill="#B94660" stroke="none" stroke-width="1" rx="0"/><text x="387" y="367" font-size="23" fill="#FBF8F5" text-anchor="middle" font-weight="400">中部</text><text x="387" y="408" font-size="34" fill="#FBF8F5" text-anchor="middle" font-weight="700">21</text></g><g data-key="5" opacity="1"><rect x="458" y="318" width="127" height="127" fill="#8E1D38" stroke="none" stroke-width="1" rx="0"/><text x="521" y="367" font-size="23" fill="#FBF8F5" text-anchor="middle" font-weight="400">东部</text><text x="521" y="408" font-size="34" fill="#FBF8F5" text-anchor="middle" font-weight="700">25</text></g><g data-key="6" opacity="1"><rect x="190" y="452" width="127" height="127" fill="#E7A4B0" stroke="none" stroke-width="1" rx="0"/><text x="253" y="501" font-size="23" fill="#30262D" text-anchor="middle" font-weight="400">西南</text><text x="253" y="542" font-size="34" fill="#30262D" text-anchor="middle" font-weight="700">11</text></g><g data-key="7" opacity="1"><rect x="324" y="452" width="127" height="127" fill="#B94660" stroke="none" stroke-width="1" rx="0"/><text x="387" y="501" font-size="23" fill="#FBF8F5" text-anchor="middle" font-weight="400">南部</text><text x="387" y="542" font-size="34" fill="#FBF8F5" text-anchor="middle" font-weight="700">18</text></g><g data-key="8" opacity="1"><rect x="458" y="452" width="127" height="127" fill="#8E1D38" stroke="none" stroke-width="1" rx="0"/><text x="521" y="501" font-size="23" fill="#FBF8F5" text-anchor="middle" font-weight="400">东南</text><text x="521" y="542" font-size="34" fill="#FBF8F5" text-anchor="middle" font-weight="700">23</text></g><text x="1110" y="270" font-size="48" fill="#A51D36" text-anchor="end" font-weight="700">中部 / 东部</text><text x="1110" y="298" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">密度较高的连续区域</text><text x="710" y="350" font-size="27" fill="#30262D" text-anchor="start" font-weight="600">方位关系保留</text><text x="710" y="390" font-size="20" fill="#6E6067" text-anchor="start" font-weight="400">格子面积不代表区域面积</text><text x="710" y="428" font-size="20" fill="#6E6067" text-anchor="start" font-weight="400">仅为虚构区域布局示意</text><rect x="710" y="490" width="54" height="16" fill="#FBEDEF" stroke="none" stroke-width="1" rx="0"/><rect x="764" y="490" width="54" height="16" fill="#F3CDD4" stroke="none" stroke-width="1" rx="0"/><rect x="818" y="490" width="54" height="16" fill="#E7A4B0" stroke="none" stroke-width="1" rx="0"/><rect x="872" y="490" width="54" height="16" fill="#D57286" stroke="none" stroke-width="1" rx="0"/><rect x="926" y="490" width="54" height="16" fill="#B94660" stroke="none" stroke-width="1" rx="0"/><rect x="980" y="490" width="54" height="16" fill="#8E1D38" stroke="none" stroke-width="1" rx="0"/><text x="710" y="535" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">低密度</text><text x="1034" y="535" font-size="18" fill="#6E6067" text-anchor="end" font-weight="400">高密度</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：无时间维度</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：九个虚构区域，非实际行政边界</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>