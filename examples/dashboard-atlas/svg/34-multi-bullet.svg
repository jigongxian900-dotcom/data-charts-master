<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-multi-bullet desc-multi-bullet"><title id="title-multi-bullet">不同单位，各看各的目标</title><desc id="desc-multi-bullet">规模、准确率与时长是否满足各自目标？ 独立数轴分面，目标短线配直接标签，避免异单位柱长相互比较。 时长越低越好；不将不同指标的达成率无权重求平均。 三个独立指标；时长指标向下为改善</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 34     指标 · 多指标目标子弹</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">分指标单位</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">不同单位，各看各的目标</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="80" y="225" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">营业额</text><text x="80" y="255" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">越高越好 ↑</text><g data-key="0" opacity="1"><rect x="330" y="210" width="620" height="20" fill="#E4D9DC" stroke="none" stroke-width="1" rx="0"/><rect x="330" y="210" width="489.1111111111111" height="20" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><line x1="839.7777777777778" y1="197" x2="839.7777777777778" y2="245" stroke="#30262D" stroke-width="3" /><text x="330" y="271" font-size="16" fill="#6E6067" text-anchor="start" font-weight="400">0</text><text x="950" y="271" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">180 万元</text><text x="1110" y="225" font-size="24" fill="#30262D" text-anchor="end" font-weight="600">142 / 148</text><text x="1110" y="256" font-size="18" fill="#AF4A25" text-anchor="end" font-weight="400">未达目标</text></g><text x="80" y="357" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">订单准确率</text><text x="80" y="387" font-size="17" fill="#6E6067" tex