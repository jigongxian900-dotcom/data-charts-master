<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-parallel-coordinates desc-parallel-coordinates"><title id="title-parallel-coordinates">四种指标，不压成一个总分</title><desc id="desc-parallel-coordinates">六个站点的规模、利润、时长与准确率各自怎样？ 每轴保留独立单位和明确范围，连线关联同一站点的四个值。 显示位置按各轴范围归一化，不是综合得分；时长越低越好。 六站点；轴范围分别20—100、10—30、10—40、90—100</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 48     关系 · 平行坐标</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">各轴独立单位</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">四种指标，不压成一个总分</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="260" y1="235" x2="260" y2="540" stroke="#6E6067" stroke-width="1.5" /><text x="260" y="181" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">订单量</text><text x="260" y="208" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">(万单)</text><line x1="490" y1="235" x2="490" y2="540" stroke="#6E6067" stroke-width="1.5" /><text x="490" y="181" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">利润率</text><text x="490" y="208" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">(%)</text><line x1="720" y1="235" x2="720" y2="540" stroke="#6E6067" stroke-width="1.5" /><text x="720" y="181" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">处理时长</text><text x="720" y="208" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">(分钟)</text><line x1="950" y1="235" x2="950" y2="540" stroke="#6E6067" stroke-width="1.5" /><text x="950" y="181" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">准确率</text><text x="950" y="208" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">(%)</text><g data-key="0" opacity="1"><path d="M260,292.1875 L490,357 L720,397.66666666666663 L950,387.5" fill="none" stroke="#A51D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="260" cy="292.1875" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><circle cx="490" cy="357" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><circle cx="720" cy="397.66666666666663" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><circle cx="950" cy="387.5" r="4" fill="#A51D36" stroke="none" stroke-width="1"/><text x="1008" y="393.5" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">A</text></g><g data-key="1" opacity="1"><path d="M260,357 L490,311.25 L720,458.6666666666667 L950,296" fill="none" stroke="#287C82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><circle cx="260" cy="357" r="4" fill="#287C82" stroke="none" stroke-width="1"/><circle cx="490" cy="311.25" r="4" fill="#287C82" stroke="none" stroke-width="1"/><circle cx="720" cy="458.6666666666667" r="4" fill="#287C82" stroke="none" stroke-width="1"/><circle cx="950" cy="296" r="4" fill="#287C82" stroke="none" stroke-width="1"/><text x="1008" y="302" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">B</text></g><g data-key="2" opacity="1"><path d="M260,402.75 L490,418 L720,346.83333333333337 L950,357" fill="none" stroke="#A77B27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><circle cx="260" cy="402.75" r="4" fill="#A77B27" stroke="none" stroke-width="1"/><circle cx="490" cy="418" r="4" fill="#A77B27" stroke="none" stroke-width="1"/><circle cx="720" cy="346.83333333333337" r="4" fill="#A77B27" stroke="none" stroke-width="1"/><circle cx="950" cy="357" r="4" fill="#A77B27" stroke="none" stroke-width="1"/><text x="1008" y="363" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">C</text>