font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">20</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="247" y="392.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">60</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="247" y="240" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">100</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="477" y="545" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">10</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="477" y="392.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">20</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="477" y="240" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">30</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="707" y="545" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">10</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="707" y="392.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">25</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="707" y="240" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">40</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="937" y="545" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">90</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="937" y="392.5" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">95</text></g><g stroke="#FBF8F5" stroke-width="7" stroke-linejoin="round" paint-order="stroke"><text x="937" y="240" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">100</text></g><text x="80" y="625" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">同一连线代表一个站点；时长向下更好，其余指标向上更高。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一模拟统计窗，未指定日期</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：六站点；轴范围分别20—100、10—30、10—40、90—100</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>