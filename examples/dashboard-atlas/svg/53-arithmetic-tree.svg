<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-arithmetic-tree desc-arithmetic-tree"><title id="title-arithmetic-tree">把142万元拆回可核对的等式</title><desc id="desc-arithmetic-tree">营业额如何与订单数、客单价及店日数连接？ 树展示乘法等式与单位转换，叶节点数值能精确重算根节点。 这是一组算术恒等式，不是因果树；店日数为营业门店日合计。 同一门店范围；营业额=订单数×客单价</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 53     贡献 · 指标算术树</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">见节点单位</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">把142万元拆回可核对的等式</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><path d="M320,355 L380,355 L380,262 L440,262" fill="none" stroke="#6E6067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M380,355 L380,487 L440,487" fill="none" stroke="#6E6067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M695,262 L770,262 L770,232 L840,232" fill="none" stroke="#6E6067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M770,262 L770,427 L840,427" fill="none" stroke="#6E6067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="376" font-size="27" fill="#A51D36" text-anchor="middle" font-weight="700">×</text><text x="750" y="335" font-size="27" fill="#A51D36" text-anchor="middle" font-weight="700">×</text><g data-key="0" opacity="1"><rect x="80" y="280" width="240" height="150" fill="#A51D36" stroke="#A51D36" stroke-width="1" rx="0"/><text x="100" y="311" font-size="20" fill="#FBF8F5" text-anchor="start" font-weight="600">营业额</text><text x="100" y="362" font-size="42" fill="#FBF8F5" text-anchor="start" font-weight="700">142</text><text x="100" y="413" font-size="18" fill="#FBF8F5" text-anchor="start" font-weight="400">万元</text></g><g data-key="1" opacity="1"><rect x="440" y="190" width="255" height="145" fill="#FFFFFF" stroke="#E4D9DC" stroke-width="1" rx="0"/><text x="460" y="221" font-size="20" fill="#30262D" text-anchor="start" font-weight="600">订单数</text><text x="460" y="272" font-size="42" fill="#A51D36" text-anchor="start" font-weight="700">71,000</text><text x="460" y="318" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">单</text></g><g data-key="2" opacity="1"><rect x="440" y="415" width="255" height="145" fill="#FFFFFF" stroke="#E4D9DC" stroke-width="1" rx="0"/><text x="460" y="446" font-size="20" fill="#30262D" text-anchor="start" font-weight="600">客单价</text><text x="460" y="497" font-size="42" fill="#A51D36" text-anchor="start" font-weight="700">20</text><text x="460" y="543" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">元 / 单</text></g><g data-key="3" opacity="1"><rect x="840" y="170" width="280" height="125" fill="#FFFFFF" stroke="#E4D9DC" stroke-width="1" rx="0"/><text x="860" y="201" font-size="20" fill="#30262D" text-anchor="start" font-weight="600">营业店日</text><text x="860" y="252" font-size="42" fill="#A51D36" text-anchor="start" font-weight="700">355</text><text x="860" y="278" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">店日</text></g><g data-key="4" opacity="1"><rect x="840" y="365" width="280" height="125" fill="#FFFFFF" stroke="#E4D9DC" stroke-width="1" rx="0"/><text x="860" y="396" font-size="20" fill="#30262D" text-anchor="start" font-weight="600">每店每日订单数</text><text x="860" y="447" font-size="42" fill="#A51D36" text-anchor="start" font-weight="700">200</text><text x="860" y="473" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">单 / 店日</text></g><text x="80" y="614" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">71,000 单 × 20 元/单 = 1,420,000 元 = 142 万元；乘法关系不是原因认定。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="678" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一模拟月度统计窗，未指定日期</text><text x="60" y="701" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">范围：同一门店范围；营业额=订单数×客单价</text><text x="60" y="724" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>