<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-butterfly desc-butterfly"><title id="title-butterfly">两侧同尺，变化就在眼前</title><desc id="desc-butterfly">四种履约方式的两期规模差多少？ 中央类别保持对齐，两侧正值使用同一尺度，中央类别下方列绝对差。 左侧向左只为排版，数值不是负数；两个坐标均从0到140。到店订单=现场下单；门店自提=线上预订到店取货；两类配送均不含自提。 同组门店、四类互斥方式；到店=现场下单；自提=线上单到店取；两类配送均不含自提</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 37     比较 · 蝴蝶对照图</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万单</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">两侧同尺，变化就在眼前</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="325" y="178" font-size="24" fill="#6E6067" text-anchor="middle" font-weight="400">2025</text><text x="875" y="178" font-size="24" fill="#A51D36" text-anchor="middle" font-weight="400">2026</text><line x1="505" y1="205" x2="505" y2="552" stroke="#E4D9DC" stroke-width="1" /><line x1="695" y1="205" x2="695" y2="552" stroke="#E4D9DC" stroke-width="1" /><text x="505" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">0</text><text x="695" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">0</text><line x1="327.5" y1="205" x2="327.5" y2="552" stroke="#E4D9DC" stroke-width="1" /><line x1="872.5" y1="205" x2="872.5" y2="552" stroke="#E4D9DC" stroke-width="1" /><text x="327.5" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">70</text><text x="872.5" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">70</text><line x1="150" y1="205" x2="150" y2="552" stroke="#E4D9DC" stroke-width="1" /><line x1="1050" y1="205" x2="1050" y2="552" stroke="#E4D9DC" stroke-width="1" /><text x="150" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">140</text><text x="1050" y="591" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">140</text><g data-key="0" opacity="1"><rect x="403.57142857142856" y="235" width="101.42857142857142" height="33" fill="#9A8C92" stroke="none" stroke-width="1" rx="0"/><rect x="695" y="235" width="147.07142857142858" height="33" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="391.57142857142856" y="259" font-size="22" fill="#30262D" text-anchor="end" font-weight="600">40</text><text x="854.0714285714286" y="259" font-size="22" fill="#30262D" text-anchor="start" font-weight="600">58</text></g><text x="600" y="253" font-size="21" fill="#30262D" text-anchor="middle" font-weight="600">门店自提</text><text x="600" y="280" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">+18 万单</text><g data-key="1" opacity="1"><rect x="297.07142857142856" y="318" width="207.92857142857144" height="33" fill="#9A8C92" stroke="none" stroke-width="1" rx="0"/><rect x="695" y="318" width="238.35714285714283" height="33" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="285.07142857142856" y="342" font-size="22" fill="#30262D" text-anchor="end" font-weight="600">82</text><text x="945.3571428571429" y="342" font-size="22" fill="#30262D" text-anchor="start" font-weight="600">94</text></g><text x="600" y="336" font-size="21" fill="#30262D" text-anchor="middle" font-weight="600">到店订单</text><text x="600" y="363" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">+12 万单</text><g data-key="2" opacity="1"><rect x="350.32142857142856" y="401" width="154.67857142857144" height="33" fill="#9A8C92" stroke="none" stroke-width="1" rx="0"/><rect x="695" y="401" width="182.57142857142856" height="33" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="338.32142857142856" y="425" font-size="22" fill="#30262D" text-anchor="end" font-weight="600">61</text><text x="889.5714285714286" y="425" font-size="22" fill="#30262D" text-anchor="start" font-weight="600">72</text></g><text x="600" y="419" font-size="21" fill="#30262D" text-anchor="middle" font-weight="600">自营配送</text><text x="600" y="446" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">+11 万单</text><g data-key="3" opacity="1"><rect x="233.67857142857144" y="484" width="271.32142857142856" height="33" fill="#9A8C92" stroke="none" stroke-width="1" rx="0"/><rect x="695" y="484" width="304.2857142857143" height="33" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="221.67857142857144" y="508" font-size="22" fill="#30262D" text-anchor="end" font-weight="600">107</text><text x="1011.2857142857142" y="508" font-size="22" fill="#30262D" text-anchor="start" font-weight="600">120</text></g><text x="600" y="502" font-size="21" fill="#30262D" text-anchor="middle" font-weight="600">平台配送</text><text x="600" y="529" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">+13 万单</text><text x="80" y="624" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">左右均为正数量、同一 0—140 万单刻度；中央下行是绝对增量。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="663" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">期间：2025年 vs 2026年 · 合成情景</text><text x="60" y="679" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">范围：同组门店、四类互斥方式；到店=现场下单；自提=线上单到店取；两类配送均不含自提</text><text x="60" y="695" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>