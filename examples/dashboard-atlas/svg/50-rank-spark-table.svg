<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-rank-spark-table desc-rank-spark-table"><title id="title-rank-spark-table">排名之外，留一条变化路径</title><desc id="desc-rank-spark-table">各区域本月规模、同比和近半年走势怎样？ 一行一个区域，数值列可精确核对，迷你线用共享范围补充走势。 按本月规模降序；迷你线共享0—180刻度，不单独放大波动。 六个模拟区域，表保留全部观测</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 50     比较 · 排名表与迷你趋势</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">排名之外，留一条变化路径</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="90" y="178" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">区域</text><text x="460" y="178" font-size="19" fill="#6E6067" text-anchor="end" font-weight="400">12月规模</text><text x="660" y="178" font-size="19" fill="#6E6067" text-anchor="end" font-weight="400">同比去年12月</text><text x="810" y="178" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">7—12月 · 共享尺度</text><line x1="90" y1="249" x2="1110" y2="249" stroke="#E4D9DC" stroke-width="1" /><g data-key="0" opacity="1"><text x="90" y="223" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">01</text><text x="155" y="223" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">北区</text><text x="460" y="223" font-size="27" fill="#A51D36" text-anchor="end" font-weight="600">142</text><text x="660" y="223" font-size="22" fill="#167763" text-anchor="end" font-weight="600">+22.4%</text><line x1="790" y1="245" x2="1070" y2="245" stroke="#E4D9DC" stroke-width="1" /><path d="M790,210.15555555555557 L846,208.2888888888889 L902,207.35555555555555 L958,205.177777777