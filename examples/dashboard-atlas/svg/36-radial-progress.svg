<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-radial-progress desc-radial-progress"><title id="title-radial-progress">不同目标，进度分别交代</title><desc id="desc-radial-progress">四项任务完成到哪一步，有没有超额？ 同心轨道展示各自完成率，邻近清单给出实际、目标和超额。 不同半径的弧长不能直接比较数量；精确排序优先用子弹图。 四项独立任务，目标分别设定</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 36     指标 · 多任务径向进度</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">件 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">不同目标，进度分别交代</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><g data-key="0" opacity="1"><circle cx="350" cy="380" r="168" fill="none" stroke="#E4D9DC" stroke-width="18"/><circle cx="350" cy="380" r="168" fill="none" stroke="#A51D36" stroke-width="18" stroke-dasharray="770.5698460725044 1055.5751316061705" transform="rotate(-90 350 380)"/></g><rect x="645" y="219" width="16" height="16" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="680" y="235" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">资料整理</text><text x="1090" y="235" font-size="26" fill="#30262D" text-anchor="end" font-weight="600">73%</text><text x="680" y="266" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">73 / 100 件 </text><g data-key="1" opacity="1"><circle cx="350" cy="380" r="132" fill="none" stroke="#E4D9DC" stroke-width="18"/><circle cx="350" cy="380" r="132" fill="none" stroke="#287C82" stroke-width="18" stroke-dasharray="476.8937648149306 829.3804605477054" transform="rotate(-90 350 380)"/></g><rect x="645" y="309" width="16" height="16" fill="#287C82" stroke="none" stroke-width="1" rx="0"/><text x="680" y="325" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">渠道巡检</text><text x="1090" y="325" font-size="26" fill="#30262D" text-anchor="end" font-weight="600">57.5%</text><text x="680" y="356" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">46 / 80 件 </text><g data-key="2" opacity="1"><circle cx="350" cy="380" r="96" fill="none" stroke="#E4D9DC" stroke-width="18"/><circle cx="350" cy="380" r="96" fill="none" stroke="#A77B27" stroke-width="18" stroke-dasharray="603.1857894892403 603.1857894892403" transform="rotate(-90 350 380)"/></g><rect x="645" y="399" width="16" height="16" fill="#A77B27" stroke="none" stroke-width="1" rx="0"/><text x="680" y="415" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">门店回访</text><text x="1090" y="415" font-size="26" fill="#30262D" text-anchor="end" font-weight="600">104%</text><text x="680" y="446" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">104 / 100 件 · 超额 4 件</text><g data-key="3" opacity="1"><circle cx="350" cy="380" r="60" fill="none" stroke="#E4D9DC" stroke-width="18"/><circle cx="350" cy="380" r="60" fill="none" stroke="#79618F" stroke-width="18" stroke-dasharray="169.64600329384882 376.99111843077515" transform="rotate(-90 350 380)"/></g><rect x="645" y="489" width="16" height="16" fill="#79618F" stroke="none" stroke-width="1" rx="0"/><text x="680" y="505" font-size="23" fill="#30262D" text-anchor="start" font-weight="600">问题复核</text><text x="1090" y="505" font-size="26" fill="#30262D" text-anchor="end" font-weight="600">45%</text><text x="680" y="536" font-size="19" fill="#6E6067" text-anchor="start" font-weight="400">18 / 40 件 </text><text x="350" y="390" font-size="21" fill="#30262D" text-anchor="middle" font-weight="600">四项任务</text><text x="80" y="617" font-size="18" fill="#6E6067" text-anchor="start" font-weight="400">每条轨道单独封顶 100%；弧长因半径不同，不能用来比较件数。</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="663" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">期间：同一观察时点，未指定日历日</text><text x="60" y="679" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">范围：四项独立任务，目标分别设定</text><text x="60" y="695" font-size="12" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>