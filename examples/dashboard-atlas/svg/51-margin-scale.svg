<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-margin-scale desc-margin-scale"><title id="title-margin-scale">大市场不一定有更高利润率</title><desc id="desc-margin-scale">各市场的营业额规模与利润率如何对应？ 共享类别的两个面板分别编码规模与利润率，使用各自单位和基线。 不使用任意双轴叠加；利润率=利润÷营业额，不能简单平均。 五个市场，同一币种示意；利润口径在本例固定</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 51     关系 · 利润率与规模组合</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元 / %</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">大市场不一定有更高利润率</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><text x="475" y="177" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">营业额 · 万元</text><text x="960" y="177" font-size="22" fill="#30262D" text-anchor="middle" font-weight="600">利润率 · %</text><line x1="250" y1="195" x2="250" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="250" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">0</text><line x1="340" y1="195" x2="340" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="340" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">100</text><line x1="430" y1="195" x2="430" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="430" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">200</text><line x1="520" y1="195" x2="520" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="520" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">300</text><line x1="610" y1="195" x2="610" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="610" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">400</text><line x1="700" y1="195" x2="700" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="700" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">500</text><line x1="845" y1="195" x2="845" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="845" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">0%</text><line x1="921.6666666666666" y1="195" x2="921.6666666666666" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="921.6666666666666" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">10%</text><line x1="998.3333333333333" y1="195" x2="998.3333333333333" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="998.3333333333333" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">20%</text><line x1="1075" y1="195" x2="1075" y2="560" stroke="#E4D9DC" stroke-width="1" /><text x="1075" y="592" font-size="16" fill="#6E6067" text-anchor="middle" font-weight="400">30%</text><text x="218" y="242" font-size="22" fill="#30262D" text-anchor="end" font-weight="400">越南</text><g data-key="0" opacity="1"><rect x="250" y="219" width="414" height="31" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="676" y="242" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">460</text><circle cx="967.6666666666666" cy="234" r="7" fill="#287C82" stroke="none" stroke-width="1"/><text x="982.6666666666666" y="242" font-size="21" fill="#30262D" text-anchor="start" font-weight="400">16%</text></g><text x="218" y="308" font-size="22" fill="#30262D" text-anchor="end" font-weight="400">印尼</text><g data-key="1" opacity="1"><rect x="250" y="285" width="306" height="31" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="568" y="308" font-size="21" fill="#30262D" text-anchor="start" font-weight="600">340</text><circle cx="944.6666666666666" cy="300" r="7" fill="#287C82" stroke="none" stroke-width="1"/><text x="959.6666666666666" y="308" font-size="21" fill="#3