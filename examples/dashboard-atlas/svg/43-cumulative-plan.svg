<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-cumulative-plan desc-cumulative-plan"><title id="title-cumulative-plan">单月追赶，累计仍要核对</title><desc id="desc-cumulative-plan">执行进度累积到哪里，落后计划多少？ 实际与计划从同一起点累计，差距带保留每期差额。 累计值由当期增量求和；不得把累计量当本月新增量。 两条序列均从0累计，同一执行范围</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 43     变化 · 累计实际与计划</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">万元</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">单月追赶，累计仍要核对</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="130" y1="540" x2="1050" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="115" y="546" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">0</text><line x1="130" y1="433.3333333333333" x2="1050" y2="433.3333333333333" stroke="#E4D9DC" stroke-width="1" /><text x="115" y="439.3333333333333" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">50</text><line x1="130" y1="326.66666666666663" x2="1050" y2="326.66666666666663" stroke="#E4D9DC" stroke-width="1" /><text x="115" y="332.66666666666663" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">100</text><line x1="130" y1="220" x2="1050" y2="220" stroke="#E4D9DC" stroke-width="1" /><text x="115" y="226" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">150</text><path d="M130,501.6 L314,458.93333333333334 L498,412 L682,360.79999999999995 L866,305.33333333333337 L1050,241.33333333333331 L1050,262.66666666666663 L866,326.6666666666667 L682,373.6 L498,426.93333333333334 L314,465.3333333333333 L130,508Z" fill="#A51D36" fill-opacity=".13"/><path d="M130,501.6 L314,458.93333333333