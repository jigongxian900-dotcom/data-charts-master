<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-waterfall desc-waterfall"><title id="title-waterfall">新增 66，节省 72，净降 6</title><desc id="desc-waterfall">FY25 到 FY26 的云预算为何减少？ 连续累加明确桥接起点与终点，新增成本与节省分开。 成本降低为节省，不标成负绩效；原创合成数据非真实企业预算。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 11     贡献 · 瀑布图</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">新增 66，节省 72，净降 6</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">千美元 / 月</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="105" y1="545" x2="1100" y2="545" stroke="#E4D9DC" stroke-width="1" /><text x="95" y="551" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">0</text><line x1="105" y1="456.42857142857144" x2="1100" y2="456.42857142857144" stroke="#E4D9DC" stroke-width="1" /><text x="95" y="462.42857142857144" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">100</text><line x1="105" y1="367.8571428571429" x2="1100" y2="367.8571428571429" stroke="#E4D9DC" stroke-width="1" /><text x="95" y="373.8571428571429" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">200</text><line x1="105" y1="279.2857142857143" x2="1100" y2="279.2857142857143" stroke="#E4D9DC" stroke-width="1" /><text x="95" y="285.2857142857143" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">300</text><g data-key="0" opacity="1"><rect x="120" y="367.8571428571429" width="120" height="177.14285714285714" fill="#A51D36" stroke="none" stroke-width="1" rx="0"/><text x="180" y="354.8571428571429" font-size="22" fill="#A51D36" text-anchor="middle" font-weight="700">200</text></g