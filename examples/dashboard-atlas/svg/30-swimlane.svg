<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-swimlane desc-swimlane"><title id="title-swimlane">一次交接，责任不模糊</title><desc id="desc-swimlane">申请、审核、执行分别由谁完成？ 横向阶段、纵向职责，箭头明确跨团队交接。 流程示意不编码真实耗时；审批权限仍以正式制度为准。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="700" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 30     流程 · 职责泳道图</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">一次交接，责任不模糊</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">职责示意</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><rect x="215" y="215" width="900" height="110" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><line x1="80" y1="215" x2="1115" y2="215" stroke="#E4D9DC" stroke-width="1" /><text x="170" y="277" font-size="23" fill="#30262D" text-anchor="end" font-weight="600">申请方</text><rect x="215" y="327" width="900" height="110" fill="#FFFFFF" stroke="none" stroke-width="1" rx="0"/><line x1="80" y1="327" x2="1115" y2="327" stroke="#E4D9DC" stroke-width="1" /><text x="170" y="389" font-size="23" fill="#30262D" text-anchor="end" font-weight="600">审核方</text><rect x="215" y="439" width="900" height="110" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><line x1="80" y1="439" x2="1115" y2="439" stroke="#E4D9DC" stroke-width="1" /><text x="170" y="501" font-size="23" fill="#30262D" text-anchor="end" font-weight="600">执行方</text><line x1="80" y1="551" x2="1115" y2="551" stroke="#E4D9DC" stroke-width="1" /><path d="M367,271 L387,271 L387,383 L411,383" stroke="#6E6067" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M410,383 l-9,-5 v10Z" fill="#6E6067"/><path d="M541,383 L561,383 L561,495 L585,495" stroke="#6E6067" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M584,495 l-9,-5 v10Z" fill="#6E6067"/><path d="M715,495 L735,495 L735,271 L759,271" stroke="#6E6067" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M758,271 l-9,-5 v10Z" fill="#6E6067"/><path d="M889,271 L909,271 L909,495 L933,495" stroke="#6E6067" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M932,495 l-9,-5 v10Z" fill="#6E6067"/><g data-key="0" opacity="1"><rect x="237" y="241" width="130" height="60" fill="#FFFFFF" stroke="#A51D36" stroke-width="2" rx="0"/><text x="302" y="278" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">提交申请</text></g><text x="302" y="185" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">01</text><g data-key="1" opacity="1"><rect x="411" y="353" width="130" height="60" fill="#FFFFFF" stroke="#A51D36" stroke-width="2" rx="0"/><text x="476" y="390" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">校验与确认</text></g><text x="476" y="185" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">02</text><g data-key="2" opacity="1"><rect x="585" y="465" width="130" height="60" fill="#FFFFFF" stroke="#A51D36" stroke-width="2" rx="0"/><text x="650" y="502" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">排期并执行</text></g><text x="650" y="185" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">03</text><g data-key="3" opacity="1"><rect x="759" y="241" width="130" height="60" fill="#FFFFFF" stroke="#A51D36" stroke-width="2" rx="0"/><text x="824" y="278" font-size="20" fill="#30262D" text-anchor="middle" font-weight="600">结果验收</text></g><text x="824" y="185" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">04</text><g data-key="4" opacity="1"><rect x="933" y="465" width="130" height="60" fill="#A51D36" stroke="#A51D36" stroke-width="2" rx="0"/><text x="998" y="502" font-size="20" fill="#FBF8F5" text-anchor="middle" font-weight="600">归档记录</text></g><text x="998" y="185" font-size="18" fill="#6E6067" text-anchor="middle" font-weight="400">05</text><line x1="215" y1="615" x2="239" y2="615" stroke="#A51D36" stroke-width="3" /><text x="249" y="620" font-size="17" fill="#6E6067" text-anchor="start" font-weight="400">左右表示阶段顺序；跨行箭头表示职责交接</text><line x1="60" y1="649" x2="1140" y2="649" stroke="#E4D9DC" stroke-width="1" /><text x="60" y="670" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">期间：机制示意，无时间维度  |  范围：三个角色，五个步骤，无真实耗时</text><text x="60" y="691" font-size="13" fill="#6E6067" text-anchor="start" font-weight="400">来源：原创合成数据，仅用于图表选型与效果演示</text></g></svg>