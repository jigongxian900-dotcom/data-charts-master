<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-forest desc-forest"><title id="title-forest">多数估计为正，区间仍有分歧</title><desc id="desc-forest">五个实验的估计差异与区间如何？ 点表示估计，线表示给定 95% 区间，以零线区分方向。 区间为合成输入；未由原始样本推断，不能据此作真实显著性判断。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 25     分布 · 估计值与区间</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">多数估计为正，区间仍有分歧</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">百分点</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="320" y1="180" x2="320" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="320" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">-3</text><line x1="405" y1="180" x2="405" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="405" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">-2</text><line x1="490" y1="180" x2="490" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="490" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">-1</text><line x1="575" y1="180" x2="575" y2="540" stroke="#6E6067" stroke-width="2" stroke-dasharray="5 5"/><text x="575" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">0</text><line x1="660" y1="180" x2="660" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="660" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">1</text><line x1="745" y1="180" x2="745" y2="540" stroke="#E4D9DC" stroke-width="1" /><text x="745" y="580" font-size="17" fill="#6E6067" text-anchor="middle" font-weight="400">2</text><line x1="830" y1="180" x2="830" y2="540"