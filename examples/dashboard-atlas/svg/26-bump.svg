<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-bump desc-bump"><title id="title-bump">名次换位，不代表规模变化</title><desc id="desc-bump">四个团队的季度排名如何变动？ 位置编码名次，连线保持团队身份，直接标注首尾。 仅反映排序；名次间距不代表绩效差额。 来源：原创合成数据，仅用于图表选型与效果演示</desc><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#FBF8F5" stroke="none" stroke-width="1" rx="0"/><text x="60" y="54" font-size="15" fill="#6E6067" text-anchor="start" font-weight="400">ATLAS / 26     变化 · 排名变化图</text><text x="60" y="103" font-size="32" fill="#30262D" text-anchor="start" font-weight="700">名次换位，不代表规模变化</text><text x="1140" y="54" font-size="16" fill="#6E6067" text-anchor="end" font-weight="400">名次</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#E4D9DC" stroke-width="1" /><line x1="300" y1="200" x2="300" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="300" y="592" font-size="21" fill="#6E6067" text-anchor="middle" font-weight="400">Q1</text><line x1="500" y1="200" x2="500" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="500" y="592" font-size="21" fill="#6E6067" text-anchor="middle" font-weight="400">Q2</text><line x1="700" y1="200" x2="700" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="700" y="592" font-size="21" fill="#6E6067" text-anchor="middle" font-weight="400">Q3</text><line x1="900" y1="200" x2="900" y2="550" stroke="#E4D9DC" stroke-width="1" /><text x="900" y="592" font-size="21" fill="#6E6067" text-anchor="middle" font-weight="400">Q4</text><g data-key="0" opacity="1"><path d="M300,225 L500,325 L700,425 L900,325" stroke="#A51D36" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="225" r="9" fill="#FBF8F5" stroke="#A51D36" stroke-width="3"/><circle cx="500" cy="325" r="9" fill="#FBF8F5" stroke="#A51D36" stroke-width="3"/><circle cx="700" cy="425" r="9" fill="#FBF8F5" stroke="#A51D36" stroke-width="3"/><circle cx="900" cy="325" r="9"