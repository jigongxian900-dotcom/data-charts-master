name: Verify examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Behavioral tests
        run: python3 scripts/test_chart_html.py
      - name: Rebuild curated examples
        run: node examples/dashboard-atlas/build_atlas.js
      - name: Check generated files are reproducible
        run: git diff --exit-code -- examples/dashboard-atlas
      - name: Verify release package
        run: python3 scripts/verify_release.py
