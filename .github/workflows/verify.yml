name: Verify examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Behavioral tests
        run: python3 scripts/test_chart_html.py
      - name: Composed output tests
        run: python3 scripts/test_compose_html.py
      - name: Coherent source and derived-view tests
        run: python3 scripts/test_operating_story.py
      - name: Custom renderer and geometry contracts
        run: |
          python3 scripts/test_custom_chart.py
          python3 scripts/test_chart_geometry.py
      - name: Interruptible data-motion contracts
        run: node scripts/test_chart_motion.cjs
      - name: Bounded motion and metric builder contracts
        run: |
          python3 scripts/scene-builder/test_scene.py
          python3 scripts/kpi-builder/test_builder.py
          python3 scripts/test_bounded_build.py
      - name: Rebuild interactive motion showcase
        run: |
          python3 examples/motion-showcase/build_showcase.py --skill-root .
          cp examples/motion-showcase/index.html docs/motion-showcase.html
          python3 examples/retained-rows/build_demos.py --skill-root .
      - name: Rebuild reports and presentations
        run: |
          python3 scripts/compose_html.py examples/composed/source.json --mode report --theme ruby --out examples/composed/report.html
          python3 scripts/compose_html.py examples/composed/source.json --mode slides --theme ruby --out examples/composed/slides.html
          python3 scripts/build_operating_story.py
      - name: Rebuild diagram and report layout examples
        run: |
          python3 scripts/build_diagram_atlas.py
          python3 scripts/build_report_layout_samples.py
          python3 scripts/workflow_diagram.py examples/workflow/source.json --out examples/workflow/index.html
          python3 examples/motion-gallery/build.py
          python3 examples/motion-composition/build.py
          cp examples/diagram-atlas/index.html docs/diagram-atlas.html
          cp examples/workflow/index.html docs/workflow-diagrams.html
          cp examples/motion-gallery/index.html docs/motion-gallery.html
          cp examples/motion-composition/index.html docs/motion-composition.html
          cp examples/report-layouts/brief.html docs/report-layouts/brief.html
          cp examples/report-layouts/report.html docs/report-layouts/report.html
          cp examples/report-layouts/slides.html docs/report-layouts/slides.html
          python3 scripts/build_chart_shape_gallery.py
          cp examples/chart-shapes/index.html docs/chart-shapes.html
      - name: Verify chart shape and report contracts
        run: |
          python3 scripts/test_chart_shapes.py
          python3 scripts/test_operating_gap_review.py
      - name: Rebuild curated examples
        run: node scripts/build_gallery.js
      - name: Rebuild autonomous desktop examples
        run: python3 scripts/rebuild_desktop_examples.py
      - name: Synchronize regression evidence examples
        run: python3 scripts/sync_regression_examples.py
      - name: Check generated files are reproducible
        run: git diff --exit-code -- examples/dashboard-atlas examples/composed examples/operating-story examples/autonomous-desktop examples/regression docs/desktop docs/regression docs/index.html docs/source-data.json docs/labs docs/report.html docs/slides.html docs/operating-story.html examples/motion-showcase/index.html docs/motion-showcase.html examples/diagram-atlas examples/report-layouts examples/workflow examples/motion-gallery/index.html examples/motion-composition/index.html docs/diagram-atlas.html docs/report-layouts docs/workflow-diagrams.html docs/chart-shapes.html examples/chart-shapes docs/motion-gallery.html docs/motion-composition.html examples/retained-rows/harvest.html examples/retained-rows/fulfilment.html
      - name: Verify release package
        run: python3 scripts/verify_release.py
