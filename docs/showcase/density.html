<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>售后工单与支出 · 见数</title>
<style>
  :root{color-scheme:light;--paper:#fbf8f5;--white:#fffdfa;--ink:#30262d;--muted:#695d62;--line:#dfd4d5;--accent:#a51d36}
  *{box-sizing:border-box}
  html{scroll-padding-top:18px}
  body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.58 "Microsoft YaHei","PingFang SC",sans-serif}
  main{width:min(1216px,calc(100% - 88px));margin:auto}
  a{color:var(--accent);text-underline-offset:.23em}
  header.top{border-top:5px solid var(--accent);padding:16px 0 22px}
  nav{display:flex;flex-wrap:wrap;gap:8px 23px;align-items:center;font-size:14px}
  nav .home{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--ink);margin-right:auto}
  h1,h2{font:700 clamp(30px,4.7vw,64px)/1.14 "Songti SC","SimSun",serif;margin:0}
  h1{margin:22px 0 7px}
  h2{font-size:clamp(25px,3.2vw,42px)}
  p{margin:5px 0 0}
  .eyebrow{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 4px}
  .muted,figcaption,footer{color:var(--muted);font-size:14px}
  section{border-top:1px solid var(--line);padding:25px 0 29px}
  .section-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px;margin-bottom:14px}
  .controls,.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:14px}
  select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--white);border:1px solid #96868a;padding:5px 8px;cursor:pointer;border-radius:0}
  select{max-width:100%}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
  button:disabled{opacity:.55;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .layout{display:grid;grid-template-columns:minmax(0,3.2fr) minmax(222px,1fr);gap:20px;margin-top:13px;align-items:start}
  figure{margin:0;padding:10px 11px 9px;background:var(--white);border:1px solid var(--line)}
  svg{display:block;width:100%;height:auto}
  svg text{font:14px/1 "Microsoft YaHei","PingFang SC",sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}
  svg .mark{cursor:pointer}
  svg .mark:focus-visible{outline:0;stroke:#221d22;stroke-width:2.8;vector-effect:non-scaling-stroke}
  svg .amount{font-size:12px}
  figcaption{padding:7px 2px 2px;border-top:1px solid var(--line);line-height:1.55}
  aside{border-top:3px solid var(--accent);padding:10px 2px 0}
  aside h3{font-size:17px;margin:0 0 3px;line-height:1.35}
  .number{font:700 clamp(29px,3.6vw,48px)/1.12 Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:7px 0}
  .label-list{font-size:14px;padding:0;margin:8px 0 0;list-style:none}
  .label-list li{border-top:1px solid var(--line);padding:5px 0;display:flex;justify-content:space-between;gap:4px 10px}
  .data-select{margin-top:12px;display:flex;align-items:stretch;flex-direction:column;gap:4px}
  .data-select select{display:block;width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 8px;font-size:13px;color:var(--muted)}
  .swatch{display:inline-block;width:12px;height:12px;border:1px solid #8d7479;margin:0 4px -1px 0}
  .crumbs{margin:2px 0 7px;min-height:34px}
  .crumbs button{border:0;border-bottom:1px solid var(--line);color:var(--accent);background:none;padding:3px 0}
  .crumbs [aria-current]{font-weight:700;color:var(--ink)}
  details{margin-top:8px;border-bottom:1px solid var(--line);padding:4px 0}
  summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.6}
  .table-wrap{overflow:auto;max-height:330px}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:700;background:var(--paper)}
  td[data-missing="true"]{color:var(--muted)}
  [hidden]{display:none!important}
  footer{display:flex;gap:12px 23px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding:15px 0 28px}
  @media(max-width:850px){main{width:calc(100% - 38px)}.layout,.section-title{grid-template-columns:1fr}.layout{gap:11px}}
  @media print{main{width:100%}.controls,nav,button,.data-select{display:none}figure,aside{break-inside:avoid}section{break-inside:avoid}.layout{grid-template-columns:minmax(0,3fr) minmax(130px,1fr)}}
</style>
</head>
<body>
<main>
  <header class="top">
    <nav aria-label="图表导航"><a class="home" href="../../catalog.html">Jee Charts · 见数</a><a href="#hexbin">六边形分箱</a><a href="#icicle">冰柱图</a><a href="#matrix-totals">矩阵与合计</a></nav>
    <h1>售后工单与支出</h1>
    <p class="muted">2026 年秋季 · 响应分布、支出构成与每周工单 · 三组独立合成数据</p>
  </header>
  <section id="hexbin">
    <div class="section-title">
      <div><p class="eyebrow">响应分布</p><h2>工单的响应与解决时长怎样分布？</h2></div>
      <div class="controls">
        <label>班次<select id="shift"><option value="all">全部班次</option><option value="day">日班</option><option value="night">夜班</option></select></label>
        <button id="hex-toggle" type="button" aria-pressed="false">查看原始点</button>
      </div>
    </div>
    <div class="layout">
      <figure id="hex-figure">
        <div class="legend" id="hex-legend" aria-label="分箱计数图例"></div>
        <svg id="hex-plot" viewBox="0 0 730 350" role="group" aria-label="首次响应时长和解决时长的联合分布"></svg>
        <figcaption id="hex-caption">色深表示各箱工单数。横纵轴和分箱边界在换班次时保持不变。</figcaption>
      </figure>
      <aside aria-labelledby="hex-label">
        <h3 id="hex-label">已配对工单</h3>
        <div id="hex-total" class="number" aria-live="polite"></div>
        <p class="muted" id="hex-coverage"></p>
        <label class="data-select">核对分箱<select id="hex-bin"></select></label>
        <p id="hex-selected" aria-live="polite"></p>
        <p class="muted" id="hex-interval"></p>
      </aside>
    </div>
    <details id="hex-details"><summary>查看选中分箱的工单</summary><div class="table-wrap"><table id="hex-data"></table></div></details>
    <details><summary>查看未配对工单</summary><div class="table-wrap"><table id="hex-missing"></table></div></details>
  </section>
  <section id="icicle">
    <div class="section-title">
      <div><p class="eyebrow">支出构成</p><h2>售后支出主要落在哪一条分支？</h2></div>
      <label>查看分支<select id="tree-focus"></select></label>
    </div>
    <nav class="crumbs" id="tree-path" aria-label="当前支出层级"></nav>
    <div class="layout">
      <figure id="tree-figure">
        <svg id="tree-plot" viewBox="0 0 730 272" role="group" aria-label="售后支出从类型到原因的分层构成"></svg>
        <figcaption id="tree-caption">每一层横向长度按当前范围内金额编码。短分支保留自身层级。</figcaption>
      </figure>
      <aside aria-labelledby="tree-label">
        <h3 id="tree-label"></h3>
        <div class="number" id="tree-value" aria-live="polite"></div>
        <p id="tree-scope" class="muted"></p>
        <ul id="tree-list" class="label-list"></ul>
      </aside>
    </div>
    <details><summary>查看当前分支的叶级金额</summary><div class="table-wrap"><table id="tree-data"></table></div></details>
  </section>
  <section id="matrix-totals">
    <div class="section-title">
      <div><p class="eyebrow">每周工单</p><h2>当周工单量由哪些队列贡献？</h2></div>
      <div class="controls">
        <label>队列<select id="matrix-row"></select></label>
        <label>周次<select id="matrix-week"></select></label>
      </div>
    </div>
    <div class="layout">
      <figure id="matrix-figure">
        <svg id="matrix-plot" viewBox="0 0 730 344" role="group" aria-label="每周各队列工单矩阵及行列合计"></svg>
        <figcaption>色深表示单元格工单数；上方与右侧是两条独立合计尺度。带 * 的合计含缺报，只合计已知值。</figcaption>
      </figure>
      <aside aria-labelledby="matrix-label">
        <h3 id="matrix-label"></h3>
        <div id="matrix-value" class="number" aria-live="polite"></div>
        <ul id="matrix-summary" class="label-list"></ul>
      </aside>
    </div>
    <details><summary>查看矩阵原值、覆盖与合计</summary><div class="table-wrap"><table id="matrix-data"></table></div></details>
  </section>
  <footer><span>来源：见数合成示例。</span><button type="button" id="download">下载样例源数据</button></footer>
</main>

  const y=my(row), item=rowTotals[row];
  text(matrixSVG,92,y+22,branch.label,"end");
  svg(matrixSVG,"rect",{x:543,y:y+10,width:item.total/rowMax*107,height:15,fill:"#aa919b","data-row-total":row});
  text(matrixSVG,691,y+22,withMissing(item),"end");
  for(const [column,value] of branch.values.entries()){
    const background=value===null?"url(#matrix-missing)":value===0?"#f9f5f3":shades[band(value)];
    const marker=svg(matrixSVG,"rect",{x:mx(column)+1,y:y+1,width:matrixBox.w-2,height:matrixBox.h-2,fill:background,
      "data-row":row,"data-column":column,"data-value":value});
    pick(marker,branch.label+"，"+matrix.weeks[column]+" 周，"+(value===null?"未报":value+" 件"),()=>chooseCell(row,column));
    cellsMatrix.push(marker);
    const label=text(matrixSVG,mx(column)+matrixBox.w/2,y+22,value===null?"—":value,"middle",{"pointer-events":"none"});
    label.style.fill=value!==null&&value>=26?white:ink;
  }
}
const matrixGuide=svg(matrixSVG,"g",{"pointer-events":"none",fill:"none",stroke:accent,"stroke-width":1.5});
const rowGuide=svg(matrixGuide,"rect",{x:matrixBox.x,y:0,width:592,height:matrixBox.h});
const colGuide=svg(matrixGuide,"rect",{x:0,y:19,width:matrixBox.w,height:304});
const focusGuide=svg(matrixGuide,"rect",{x:mx(3)+2,y:my(0)+2,width:matrixBox.w-4,height:matrixBox.h-4,"stroke-width":2.7});
const focusMotion=ChartMotion.create({scene:{focus:{x:mx(3),y:my(0)}},duration:410,paint(scene,info){
  const {x,y}=scene.get("focus");
  rowGuide.setAttribute("y",y);colGuide.setAttribute("x",x);
  const opacity=info.phase==="settled"?1:.32;
  rowGuide.setAttribute("opacity",opacity);colGuide.setAttribute("opacity",opacity);
  matrixSVG.dataset.phase=info.phase;
}});
function chooseCell(row,column,animate=true){
  $("matrix-row").value=String(row);$("matrix-week").value=String(column);
  const topic=matrix.rows[row], value=topic.values[column];
  $("matrix-label").textContent=topic.label+" · "+matrix.weeks[column]+" 起的一周";
  $("matrix-value").textContent=value===null?"未报":fmt(value)+" 件";
  const previous=topic.values[column-1];
  const delta=column>0&&value!==null&&previous!==null?value-previous:null;
  const figures=[
    ["队列累计",withCoverage(rowTotals[row])],
    ["本周已知合计",withCoverage(colTotals[column])]
  ];
  if(column>0)figures.splice(1,0,["队列较上周",delta===null?"缺同口径值":(delta>0?"+":"")+fmt(delta)+" 件"]);
  list($("matrix-summary"),figures);
  for(const marker of cellsMatrix){
    const selected=Number(marker.dataset.row)===row&&Number(marker.dataset.column)===column;
    marker.setAttribute("aria-pressed",String(selected));
  }
  focusGuide.setAttribute("x",mx(column)+2);
  focusGuide.setAttribute("y",my(row)+2);
  focusMotion.to({focus:{x:mx(column),y:my(row)}},{duration:animate?410:0});
}
replaceOptions($("matrix-row"),matrix.rows.map((row,i)=>[i,row.label]),0);
replaceOptions($("matrix-week"),matrix.weeks.map((week,i)=>[i,week]),3);
function changeCell(){chooseCell(Number($("matrix-row").value),Number($("matrix-week").value))}
$("matrix-row").onchange=changeCell;$("matrix-week").onchange=changeCell;
const matrixTable=matrix.rows.map((row,i)=>[row.label,...row.values,withMissing(rowTotals[i]),rowTotals[i].known+"/"+rowTotals[i].size]);
matrixTable.push(["周合计",...colTotals.map(withMissing),"—","—"]);
matrixTable.push(["周覆盖",...colTotals.map(item=>item.known+"/"+item.size),"—","—"]);
table($("matrix-data"),["队列",...matrix.weeks,"队列合计","覆盖"],matrixTable);
chooseCell(0,3,false);

$("download").onclick=()=>{
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const link=document.createElement("a");link.href=url;link.download="售后图型样例源数据.json";link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
};
</script>
