<script>(function(root){
"use strict";

function create({request, cancel} = {}) {
  const requestFrame = request ?? (callback => root.requestAnimationFrame(callback));
  const cancelFrame = cancel ?? (id => root.cancelAnimationFrame(id));
  let generation = 0;
  let pending = null;
  let running = false;

  function stop() {
    generation++;
    if (pending !== null) cancelFrame(pending);
    pending = null;
    running = false;
  }

  function start(beats, paint, done = () => {}) {
    const ends = [];
    let total = 0;
    for (const beat of beats) {
      if (![beat.move, beat.hold].every(time => Number.isFinite(time) && time >= 0) ||
          beat.move + beat.hold === 0) throw new RangeError("Each beat needs a duration.");
      total += beat.move + beat.hold;
      ends.push(total);
    }
    if (!ends.length) throw new RangeError("At least one beat is required.");
    stop();
    running = true;
    const id = generation;
    let origin;
    function frame(time) {
      if (id !== generation) return;
      pending = null;
      origin ??= time;
      const elapsed = Math.max(0, time - origin);
      const index = ends.findIndex(end => elapsed < end);
      if (index === -1) {
        running = false;
        done();
        return;
      }
      const offset = elapsed - (ends[index - 1] || 0);
      const move = beats[index].move;
      const progress = move ? Math.min(1, offset / move) : 1;
      paint({index, progress, arrived: progress === 1});
      if (id === generation) pending = requestFrame(frame);
    }
    pending = requestFrame(frame);
  }

  return {start, stop, isRunning: () => running};
}

const api = {create};
if (typeof module === "object" && module.exports) module.exports = api;
else root.JeeEvidenceTimeline = api;
})(globalThis);
</script>
<script>(() => {
"use strict";
const $ = selector => document.querySelector(selector);
const cfg = JSON.parse($("#configuration").textContent);
const {kind,mode,copy,data} = cfg;
const root = $("#root");
const timeline = JeeEvidenceTimeline.create();
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const sum = list => list.reduce((total,value) => total+value,0);
const esc = value => String(value).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = value => value.toLocaleString("zh-CN");
const rule = "var(--rule)", hair = "var(--hair)", tone = "var(--ink)", soft = "var(--sub)";
const focus = "var(--focus)", cold = "var(--cool)", pale = "var(--hot)";
const dark = mode!=="brief";
const primary = dark?pale:tone, minor=dark?cold:soft, grid=dark?hair:rule;
const ray = (x1,y1,x2,y2,stroke,width=1,extra="") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
const dot = (x,y,r,fill,stroke=fill,width=1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${width}"/>`;
const txt = (x,y,value,fill=primary,size=19,anchor="start",weight=550) => `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">${esc(value)}</text>`;
const svg = (content,label,height=402) => `<svg viewBox="0 0 1000 ${height}" role="img" aria-label="${esc(label)}">${content}</svg>`;
const mute = "#b14d35";
const marker = dark?focus:mute;

function water(frame) {
  const levels=data.stations.map(item=>item.levels);
  const x=i=>81+i*114;
  const y=v=>321-(v-55)*12.50;
  const shown=frame.full?7:frame.index;
  const chosen=frame.arrived?frame.index:frame.index-1;
  let shape=txt(34,40,"cm",minor,16);
  for (const val of [55,60,65,70,75]) {
    shape+=ray(81,y(val),924,y(val),val===65?marker:grid,val===65?1.7:1,val===65?'stroke-dasharray="6 6"':"")+txt(69,y(val)+6,val,minor,16,"end");
  }
  shape+=txt(931,y(65)-6,"关注线",minor,15);
  if(chosen>=0)shape+=ray(x(chosen),45,x(chosen),324,marker,1,'opacity=".7"');
  for(let i=1;i<=shown;i++){
    if(levels[1][i-1]===null||levels[1][i]===null||(!frame.full&&i===shown&&!frame.arrived))continue;
    shape+=`<path d="M${x(i-1)} ${y(levels[0][i-1])}L${x(i)} ${y(levels[0][i])}L${x(i)} ${y(levels[1][i])}L${x(i-1)} ${y(levels[1][i-1])}Z" fill="${minor}" opacity=".13"/>`;
  }
  levels.forEach((list,j)=>{
    const color=j?minor:primary;
    list.forEach((value,i)=>{
      if(value===null||i>shown)return;
      const isMoving=!frame.full&&i===shown&&!frame.arrived;
      if(i>0&&list[i-1]!==null){
        const p=isMoving?frame.progress:1;
        shape+=ray(x(i-1),y(list[i-1]),x(i-1)+(x(i)-x(i-1))*p,y(list[i-1])+(y(value)-y(list[i-1]))*p,color,j?2.4:3.1,j?'stroke-dasharray="6 5"':"");
      }
      if(!isMoving){
        shape+=dot(x(i),y(value),i===chosen?7.5:4.7,j?(dark?"var(--panel)":"var(--paper)"):(i===chosen?marker:color),color,2);
        if(i===chosen)shape+=txt(x(i)+(j?13:-13),y(value)+(j?27:-14),value,primary,27,j?"start":"end",800);
      }
    });
  });
  data.days.forEach((day,i)=>{shape+=txt(x(i),353,day,i===chosen?marker:minor,18,"middle",i===chosen?800:550)});
  if (shown>=2)shape+=txt(x(2),382,"下游缺测",minor,15,"middle");
  return svg(shape,"上下游同日水尺，实线为上游，虚线为下游，8 月 6 日下游缺测");
}

const base=kind==="repairs"?data.zones.map(zone=>{
  const [orders,confirmed,,pending]=zone.weeks.at(-1);
  const gap=Math.ceil(orders*data.target)-confirmed;
  return {name:zone.name,minimum:gap-pending,gap};
}):[];
const returns=[0,7,8];
function repairs(frame) {
  const picked=returns[frame.index];
  const north=base[0].gap-(frame.arrived?picked:returns[frame.index-1]+(picked-returns[frame.index-1])*frame.progress);
  const values=[north,base[1].gap];
  let shape=txt(885,47,"单位 · 单",minor,16);
  for(const tick of [0,6,12,18,24])shape+=txt(164+tick*27,56,tick,minor,16,"middle");
  values.forEach((value,j)=>{
    const y=90+j*112;
    shape+=txt(50,y+36,base[j].name,primary,27,"start",800);
    for(let i=0;i<24;i++){
      const filled=Math.min(1,Math.max(0,value-i));
      const x=164+i*27;
      shape+=`<rect x="${x}" y="${y}" width="24" height="53" rx="1" fill="none" stroke="${frame.index===2&&j===0&&i===14?marker:grid}"/>`;
      if(filled)shape+=`<rect x="${x}" y="${y}" width="${24*filled}" height="53" fill="${j?minor:marker}"/>`;
    }
    shape+=txt(897,y+39,j||frame.arrived?value:"—",primary,41,"end",850);
  });
  shape+=ray(50,293,916,293,grid);
  const actions=["账面缺口","两区并列","改派湖西"];
  shape+=txt(50,341,frame.arrived?actions[frame.index]:"代入回传情景",marker,29,"start",800);
  shape+=txt(916,340,"湖西新增确认 0 单 · 一格代表一单",minor,19,"end");
  return svg(shape,"报修情景下江北、湖西的剩余缺口");
}

function ribbon(x1,y1,x2,y2,wide){
  const mid=(x1+x2)/2;
  return `M${x1} ${y1}C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}V${y2+wide}C${mid} ${y2+wide} ${mid} ${y1+wide} ${x1} ${y1+wide}Z`;
}
let batch=0;
function textiles(frame) {
  const src=data.batches[batch], stages=["确认再用","纤维处理","待签收"];
  const factor=268/src.intake;
  const colors=[dark?"#c0b1d8":"#684f80",dark?"#afbea3":"#758764",dark?"#d5a289":"#b4705a"];
  const columns=[0,1,2].map(i=>sum(src.routes.map(row=>row.weights[i])));
  let top=44;
  const terminals=columns.map(v=>{const y=top;top+=v*factor+12;return y});
  let startY=44;
  let shape=txt(32,24,src.name+" · "+fmt(src.intake)+" kg",minor,19)+txt(747,24,"第 28 天去向",minor,19);
  src.routes.forEach((route,index)=>{
    const th=sum(route.weights)*factor;
    let from=startY;
    const p=index<frame.index?1:index===frame.index?frame.progress:0;
    const id="route"+index;
    shape+=`<defs><clipPath id="${id}"><rect x="235" y="0" width="${512*p}" height="395"/></clipPath></defs>`;
    route.weights.forEach((v,j)=>{
      const h=v*factor;
      if(v)shape+=`<path clip-path="url(#${id})" d="${ribbon(235,from,747,terminals[j],h)}" fill="${colors[j]}" opacity=".70"/>`;
      from+=h;terminals[j]+=h;
    });
    shape+=`<rect x="226" y="${startY}" width="9" height="${th}" fill="${minor}"/>`+
      txt(214,startY+20,route.name,primary,18,"end",750)+txt(214,startY+41,fmt(sum(route.weights))+" kg",minor,16,"end");
    startY+=th+12;
  });
  let y=44;
  const reached=frame.arrived?frame.index:frame.index-1;
  columns.forEach((v,i)=>{
    const shown=sum(src.routes.slice(0,reached+1).map(row=>row.weights[i]));
    shape+=`<rect x="747" y="${y}" width="9" height="${v*factor}" fill="${colors[i]}" opacity=".52"/>`;
    shape+=txt(768,y+17,stages[i],primary,19,"start",750)+txt(768,y+40,fmt(shown)+" kg",minor,17);
    y+=v*factor+12;
  });
  shape+=txt(32,382,"带宽表示重量 · 右侧为已到场的路径合计",minor,17);
  return svg(shape,"旧衣分拣流程三条路径及实际公斤数");
}

function overview(){
  if(kind==="water"){
    const [up,down]=data.stations.map(s=>s.levels);
    let shape=ray(24,115,960,115,rule)+txt(24,165,"上游",soft,25)+txt(24,204,"下游",soft,25);
    for (const i of [3,4,5]){
      const x=177+(i-3)*265;
      shape+=txt(x,64,data.days[i],soft,22)+
        txt(x,165,up[i]+" cm",i===4?mute:tone,39,"start",800)+txt(x,204,down[i]+" cm",i===5?mute:soft,32);
      if(i===4)shape+=ray(x,74,x+217,74,mute,3);
    }
    return svg(shape,"8 月 7 至 9 日上游、下游晨读，第一行上游",260);
  }
  if(kind==="repairs"){
    let shape=txt(166,38,"最少",soft,17)+txt(788,38,"账面缺口",soft,17);
    base.forEach((r,i)=>{
      const y=71+i*65, x=v=>170+v/24*640;
      shape+=txt(22,y+25,r.name,tone,22)+ray(170,y+16,810,y+16,rule)+
        `<rect x="${x(r.minimum)}" y="${y}" width="${x(r.gap)-x(r.minimum)}" height="32" fill="${i?"#b97a5c":mute}" opacity=".72"/>`+
        txt(834,y+24,r.minimum+"–"+r.gap+" 单",tone,24);
    });
    return svg(shape,"三个片区剩余缺口区间",280);
  }
  let shape="";
  const palette=["#664e84","#9baf8d","#c08970"];
  data.batches.forEach((b,i)=>{
    let ox=190;
    const y=47+i*99;
    shape+=txt(15,y+33,b.name,tone,24);
    [0,1,2].forEach(j=>{
      const v=sum(b.routes.map(r=>r.weights[j]));
      const w=v/b.intake*670;
      shape+=`<rect x="${ox}" y="${y}" width="${w}" height="51" fill="${palette[j]}"/>`;
      ox+=w;
    });
    shape+=txt(886,y+34,(sum(b.routes.map(r=>r.weights[0]))/b.intake*100).toFixed(1)+"%",tone,25);
  });
  shape+=ray(659,23,659,209,mute,2,'stroke-dasharray="5 4"')+txt(659,232,"70% 承诺",soft,18,"middle");
  return svg(shape,"春秋两批分母各自为本批入库重量，左段为确认再用率",257);
}

const beats=kind==="water"?data.days.map((_,i)=>({move:i?270:0,hold:[4,5].includes(i)?1210:220})):
  kind==="repairs"?[{move:0,hold:660},{move:580,hold:1280},{move:500,hold:1080}]:
  Array.from({length:3},()=>({move:580,hold:820}));
const last=beats.length-1;
const settled=i=>({index:i,progress:1,arrived:true,full:true});
const replayStatus=()=>timeline.isRunning();
const labels=kind==="water"?data.days:kind==="repairs"?["账面 · 0 单","并列 · 7 单","改派 · 8 单"]:data.batches.map(b=>b.name);

function notes(frame){
  const i=frame.arrived?frame.index:frame.index-1;
  if(kind==="water"){
    const [a,b]=data.stations.map(s=>s.levels[Math.max(0,i)]);
    const shown=frame.arrived?(b===null?`${a} cm / 缺测`:`${a} / ${b} cm`):"沿时序读数";
    const line=i===4?"8 月 8 日 · 上游已回线，下游仍低 3 cm":i===5?"8 月 9 日 · 下游回到线以上":b===null?"下游探头断电，保留空位":"实线 · 上游　虚线 · 下游　每日 08:00";
    return [shown,line];
  }
  if(kind==="repairs")return frame.arrived?
    [["22 / 15 单","账面差额 · 先预排江北"],["15 / 15 单","补 7 单后两区并列 · 保留江北预排"],["14 / 15 单","补 8 单后湖西缺口更大 · 改派湖西"]][i]:
    ["代入回传","当前为情景推演，下一拍显示确认的差额。"];
  const src=data.batches[batch], row=src.routes[Math.max(0,i)];
  return i<0?["跟随分拣路径","带宽表示公斤。"]:[row.name, `确认再用 ${row.weights[0]} kg · 纤维处理 ${row.weights[1]} kg · 待签收 ${row.weights[2]} kg`];
}

function display(frame){
  const chart=$("#plot");
  if(!chart)return;
  chart.innerHTML=({water,repairs,textiles}[kind])(frame);
  chart.dataset.phase=String(frame.index);
  chart.dataset.arrived=String(frame.arrived);
  const [headline,description]=notes(frame);
  if($("#read").textContent!==headline)$("#read").textContent=headline;
  if($("#explain").textContent!==description)$("#explain").textContent=description;
  for(const [i,button] of Array.from(document.querySelectorAll("[data-pick]")).entries())
    button.setAttribute("aria-pressed",String(kind==="textiles"?i===batch:frame.arrived&&i===frame.index));
}
const snap=()=>settled(kind==="water"?4:last);
function stop(frame=snap()){
  timeline.stop();
  display(frame);
  if($("#replay"))$("#replay").textContent="重看变化";
}
function play(){
  if(replayStatus()){stop();return}
  if(reduced.matches){stop();return}
  $("#replay").textContent="停止";
  timeline.start(beats,display,()=>stop(settled(last)));
}

function initPlot(){
  if(!$("#plot"))return;
  display(snap());
  $("#replay").onclick=play;
  $("#replay").hidden=reduced.matches;
  document.querySelectorAll("[data-pick]").forEach((button,i)=>button.addEventListener("click",()=>{
    if(kind==="textiles"){batch=i;stop(settled(last));}
    else stop(settled(i));
  }));
}

function table(rows){
  const [header,...body]=rows;
  return `<table class="story-table"><thead><tr>${header.map(value=>`<th scope="col">${esc(value)}</th>`).join("")}</tr></thead><tbody>${body.map((row,i)=>`<tr ${kind==="water"&&row[0]==="08.08"?'data-key=""':""}>${row.map(value=>`<td>${esc(value)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function originals(){
  if(kind==="water")return [[data.observation,...data.stations.map(s=>s.name+" / cm")],...data.days.map((day,i)=>[day,...data.stations.map(s=>s.levels[i]??"缺测")])];
  if(kind==="repairs")return [["片区","周次",...data.columns],...data.zones.flatMap(z=>z.weeks.map((row,i)=>[z.name,data.weeks[i],...(row??["未交","—","—","—"])]))];
  return [["批次","首次分拣","确认再用 / kg","纤维处理 / kg","待签收 / kg"],...data.batches.flatMap(src=>src.routes.map(r=>[src.name,r.name,...r.weights]))];
}
function fileExport(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const href=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=href;a.download=kind+"-source.json";a.click();
  requestAnimationFrame(()=>URL.revokeObjectURL(href));
}
const brand='<div class="brand"><strong>见数</strong><span>JEE CHARTS MASTER</span></div>';
const mast=nav=>`<header class="mast">${brand}<nav aria-label="内容">${nav}</nav></header>`;
const top=(title)=>`<div class="lead"><div><p class="period">${copy.period}</p><h1>${title}</h1></div><p>${copy.lead}</p></div>`;
const plate=()=>`<figure class="plate" id="motion-plate"><div class="chart-tools"><strong>${copy.plate}</strong><button id="replay" type="button">重看变化</button></div>
  <div id="plot" class="flagship-plot"></div><div class="day-picker" role="group" aria-label="核查原值">${labels.map(d=>`<button data-pick type="button">${d}</button>`).join("")}</div>
  <figcaption class="plot-note" aria-live="polite"><strong id="read"></strong><span id="explain"></span></figcaption></figure>`;
const source=()=>`<p class="source">来源 · ${copy.sourceLine}</p>`;
const next=()=>`<div class="next-line"><strong>${copy.actionTitle}</strong><p>${copy.action}</p></div>`;
const overviewBox=()=>`<div class="exhibit">${overview()}<div><strong>${copy.key}</strong><p>${copy.side}</p></div></div>`;
const split=()=>`<div class="split">${copy.notes.map(([title,detail])=>`<article><h3>${title}</h3><p>${detail}</p></article>`).join("")}</div>`;
const dataBox=()=>`<details><summary>查看原值</summary>${table(originals())}${source()}<button class="export" type="button" data-export>下载源数据 JSON</button></details>`;

function brief(){
  return `<main class="shell brief-body">${mast('<a href="#raw">原值</a>')}${top(copy.briefTitle)}<div class="brief-grid">${plate()}<aside class="brief-side"><p>本次判断</p><div class="fact">${copy.key}</div><p>${copy.side}</p>${table(copy.summaryRows)}</aside></div>
  <footer class="brief-footer">${next()}${source()}<div id="raw" class="nav-compact">${dataBox()}</div></footer></main>`;
}
function story(){
  return `<main><section class="opening" id="opening"><div class="shell">${mast('<a href="#compare">对照</a><a href="#context">核查</a><a href="#next">下一步</a><a href="#raw">原值</a>')}${top(copy.storyTitle)}${plate()}${source()}</div></section>
    <section class="story-tall" id="compare"><div class="shell"><div class="story-lede"><h2>${copy.detailTitle}</h2><p>${copy.detailSummary}</p></div>${overviewBox()}${table(copy.evidenceRows)}</div></section>
    <section class="story-tall" id="context"><div class="shell"><div class="story-lede"><h2>${copy.noteTitle}</h2><p>${copy.noteLead}</p></div>${split()}</div></section>
    <footer class="shell data-area" id="next">${next()}<div id="raw">${dataBox()}</div></footer></main>`;
}
function deck(){
  const contents=[
    `<div class="stage-lead"><div><p class="period">${copy.period}</p><h1>${copy.deckTitle}</h1></div><p>${copy.lead}</p></div>${plate()}`,
    `<div class="stage-evidence"><h2>${copy.detailTitle}</h2>${overviewBox()}<p>${copy.detailSummary}</p></div>`,
    `<div class="stage-context"><div><h2>${copy.noteTitle}</h2><p>${copy.noteLead}</p></div>${split()}</div>`,
    `<div class="stage-action"><h2>${copy.actionTitle}</h2><p>${copy.action}</p>${source()}</div>`
  ];
  return `<main class="deck"><div class="deck-frame">${contents.map((content,i)=>`<section class="slide ${i===0?"dark":""}" data-slide="${i}" ${i?"hidden":""}>${i===0?brand:""}${content}<div class="step-out"><span>见数 · ${copy.name}</span><span>${i+1} / ${contents.length}</span></div></section>`).join("")}<div id="deck-data" class="data-area" hidden>${dataBox()}<button class="export" type="button" id="exit-data">返回演示</button></div></div>
    <nav class="deck-buttons" aria-label="演示操作"><button id="prev" type="button">上一页</button><span id="page-number" aria-live="polite"></span><button id="next-slide" type="button">下一页</button><button id="show-data" type="button">原值</button></nav></main>`;
}
root.innerHTML=({brief,story,deck}[mode])();
initPlot();
document.querySelectorAll("[data-export]").forEach(button=>button.onclick=fileExport);
if(mode==="deck"){
  const all=Array.from(document.querySelectorAll(".slide"));
  let current=0;
  function select(index){
    current=Math.min(all.length-1,Math.max(0,index));
    stop();
    all.forEach((slide,i)=>{slide.hidden=i!==current});
    $("#prev").disabled=current===0;
    $("#next-slide").disabled=current===all.length-1;
    $("#page-number").textContent=(current+1)+" / "+all.length;
  }
  function toggleData(on){
    $("#deck-data").hidden=!on;
    if(on){stop();$("#deck-data summary").focus();}
    else $("#show-data").focus();
  }
  $("#prev").onclick=()=>select(current-1);
  $("#next-slide").onclick=()=>select(current+1);
  $("#show-data").onclick=()=>toggleData(true);
  $("#exit-data").onclick=()=>toggleData(false);
  addEventListener("keydown",event=>{
    if(!$("#deck-data").hidden){if(event.key==="Escape")toggleData(false);return}
    if(["ArrowLeft","PageUp"].includes(event.key))select(current-1);
    if(["ArrowRight","PageDown"].includes(event.key))select(current+1);
  });
  select(0);
}
if(location.search.includes("autoplay")&&!reduced.matches)play();
reduced.addEventListener("change",()=>{if(reduced.matches)stop();$("#replay").hidden=reduced.matches});
addEventListener("beforeprint",()=>stop());

window.JeeFlagship = {
  frameAt(ms) {
    timeline.stop();
    let position=0;
    const at=beats.findIndex(beat=>{if(ms<position+beat.move+beat.hold)return true;position+=beat.move+beat.hold;return false});
    if(at===-1){display(settled(last));return}
    const motion=beats[at].move;
    const progress=motion?Math.min(1,(ms-position)/motion):1;
    display({index:at,progress,arrived:progress===1,full:false});
  },
  duration:sum(beats.map(beat=>beat.move+beat.hold))
};
})();
</script>
</body>
</html>
